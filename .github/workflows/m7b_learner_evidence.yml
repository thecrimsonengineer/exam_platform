name: M7B Learner Evidence Engine

on:
  push:
    branches:
      - phase-m7-exam-readiness
  workflow_dispatch:

jobs:
  verify-m7b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen M7 contract and M7B test floor
        run: python3 tools/verify_m7_contract.py --phase m7b

      - name: Diff and whitespace audit
        run: |
          git diff --check origin/ui-premium-csp-logo...HEAD
          git diff --name-only origin/ui-premium-csp-logo...HEAD

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Check M7B formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/exam_readiness/models/evidence_confidence.dart \
            lib/features/exam_readiness/models/learner_assessment_attempt.dart \
            lib/features/exam_readiness/models/competency_evidence_snapshot.dart \
            lib/features/exam_readiness/repositories/learner_assessment_attempt_repository.dart \
            lib/features/exam_readiness/repositories/evidence_snapshot_repository.dart \
            lib/features/exam_readiness/services/retention_evidence_service.dart \
            lib/features/exam_readiness/services/learner_evidence_aggregation_service.dart \
            lib/services/student_question_progress_service.dart \
            test/features/exam_readiness/m7b

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Run M7B targeted tests
        run: flutter test test/features/exam_readiness/m7b

      - name: Run complete Flutter regression suite
        run: flutter test

      - name: Build production web
        run: flutter build web --release
