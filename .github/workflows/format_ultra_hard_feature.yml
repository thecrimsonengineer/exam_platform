name: Format Ultra Hard Feature

permissions:
  contents: write

on:
  push:
    branches:
      - feature-ultra-hard-dqg300-practice

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'Format Ultra Hard feature') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature-ultra-hard-dqg300-practice

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Format feature-authored files
        run: |
          dart format \
            lib/services/studio/studio_question_service.dart \
            lib/services/studio/studio_ultra_hard_question_publish_service.dart \
            lib/widgets/admin/study_content/studio_ultra_hard_question_dialog.dart \
            lib/services/practice/practice_mode_service.dart \
            lib/screens/practice/practice_hub_screen.dart \
            test/services/question_bank_service_ultra_hard_test.dart \
            test/services/studio_ultra_hard_separation_contract_test.dart \
            test/services/practice_mode_service_test.dart \
            test/screens/practice/practice_quick_launch_screen_test.dart

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/services/studio/studio_question_service.dart \
            lib/services/studio/studio_ultra_hard_question_publish_service.dart \
            lib/widgets/admin/study_content/studio_ultra_hard_question_dialog.dart \
            lib/services/practice/practice_mode_service.dart \
            lib/screens/practice/practice_hub_screen.dart \
            test/services/question_bank_service_ultra_hard_test.dart \
            test/services/studio_ultra_hard_separation_contract_test.dart \
            test/services/practice_mode_service_test.dart \
            test/screens/practice/practice_quick_launch_screen_test.dart
          git commit -m "Format Ultra Hard feature"
          git push origin HEAD:feature-ultra-hard-dqg300-practice
