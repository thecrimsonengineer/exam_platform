name: M7B One-Shot Formatter

permissions:
  contents: write

on:
  push:
    branches:
      - phase-m7-exam-readiness

jobs:
  format-m7b:
    if: ${{ !startsWith(github.event.head_commit.message, 'Format M7B implementation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: phase-m7-exam-readiness

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Format M7B files
        run: |
          dart format \
            lib/features/exam_readiness/models/evidence_confidence.dart \
            lib/features/exam_readiness/models/learner_assessment_attempt.dart \
            lib/features/exam_readiness/models/competency_evidence_snapshot.dart \
            lib/features/exam_readiness/repositories/learner_assessment_attempt_repository.dart \
            lib/features/exam_readiness/repositories/evidence_snapshot_repository.dart \
            lib/features/exam_readiness/services/retention_evidence_service.dart \
            lib/features/exam_readiness/services/learner_evidence_aggregation_service.dart \
            lib/services/student_question_progress_service.dart \
            test/features/exam_readiness/m7b

      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo "M7B files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/exam_readiness/models/evidence_confidence.dart \
            lib/features/exam_readiness/models/learner_assessment_attempt.dart \
            lib/features/exam_readiness/models/competency_evidence_snapshot.dart \
            lib/features/exam_readiness/repositories/learner_assessment_attempt_repository.dart \
            lib/features/exam_readiness/repositories/evidence_snapshot_repository.dart \
            lib/features/exam_readiness/services/retention_evidence_service.dart \
            lib/features/exam_readiness/services/learner_evidence_aggregation_service.dart \
            lib/services/student_question_progress_service.dart \
            test/features/exam_readiness/m7b
          git commit -m "Format M7B implementation"
          git push origin HEAD:phase-m7-exam-readiness
