name: ERDP-8 Daily Plan UX

on:
  push:
    branches:
      - phase-erdp8-daily-plan-ux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Enforce ERDP-8 formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/exam_readiness/screens/todays_plan_screen.dart \
            lib/features/exam_readiness/widgets/daily_plan_task_card.dart \
            test/features/exam_readiness/erdp/erdp8_daily_plan_ux_test.dart

      - name: Analyze ERDP-8 surface
        run: |
          dart analyze \
            lib/features/exam_readiness/screens/todays_plan_screen.dart \
            lib/features/exam_readiness/widgets/daily_plan_task_card.dart \
            test/features/exam_readiness/erdp/erdp8_daily_plan_ux_test.dart

      - name: Run ERDP-8 UX tests
        run: flutter test test/features/exam_readiness/erdp/erdp8_daily_plan_ux_test.dart

      - name: Run ERDP-7 integration regression
        run: flutter test test/features/exam_readiness/erdp/erdp7_readiness_action_integration_test.dart

      - name: Run ERDP-5 executable-control regression
        run: flutter test test/features/exam_readiness/erdp/erdp5_executable_daily_plan_test.dart

      - name: Run M7D Daily Plan regression
        run: flutter test test/features/exam_readiness/m7d

      - name: Diff hygiene
        run: git diff --check
