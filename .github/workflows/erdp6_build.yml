name: ERDP-6 Build Closed Evidence Loop

on:
  push:
    branches:
      - phase-erdp6-closed-evidence-loop

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Apply ERDP-6 wiring
        run: python3 tool/erdp6_wire.py

      - name: Format ERDP-6 source
        run: dart format lib/features/exam_readiness

      - name: Commit ERDP-6 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/exam_readiness
          git commit -m "ERDP-6 close evidence and adaptive replanning loop"
          git push origin HEAD:phase-erdp6-closed-evidence-loop
