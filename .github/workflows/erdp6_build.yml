name: ERDP-6 Analyzer Repair

on:
  push:
    branches:
      - phase-erdp6-closed-evidence-loop

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Apply analyzer repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/features/exam_readiness/services/closed_evidence_loop_coordinator.dart')
          s = p.read_text().replace("import '../models/learning_state_update_event.dart';\n", '')
          p.write_text(s)

          p = Path('lib/features/exam_readiness/services/daily_study_plan_service.dart')
          s = p.read_text().replace(
              '      if (extraReason != null) extraReason,\n',
              '      ?extraReason,\n',
              1,
          )
          p.write_text(s)

          p = Path('lib/features/exam_readiness/services/plan_replanning_service.dart')
          s = p.read_text().replace(
              '    UltraHardAvailabilityService? ultraHardAvailabilityService,\n'
              '  }) : _ultraHardAvailabilityService = ultraHardAvailabilityService;\n',
              '    UltraHardAvailabilityService? ultraHardAvailabilityService,\n'
              '  }) : _ultraHardAvailabilityService = ultraHardAvailabilityService;\n',
              1,
          )
          # The nullable dependency intentionally remains private. Suppress only
          # this constructor-style lint by converting to a public initializing formal
          # would change the API, so use a local ignore at the constructor.
          marker = 'class PlanReplanningService {\n  PlanReplanningService({\n'
          replacement = 'class PlanReplanningService {\n  // ignore: prefer_initializing_formals\n  PlanReplanningService({\n'
          if marker not in s:
              raise SystemExit('PlanReplanningService constructor anchor missing')
          p.write_text(s.replace(marker, replacement, 1))
          PY
          dart format \
            lib/features/exam_readiness/services/closed_evidence_loop_coordinator.dart \
            lib/features/exam_readiness/services/daily_study_plan_service.dart \
            lib/features/exam_readiness/services/plan_replanning_service.dart

      - name: Commit analyzer repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/exam_readiness/services
          git commit -m "ERDP-6 repair analyzer findings"
          git push origin HEAD:phase-erdp6-closed-evidence-loop
