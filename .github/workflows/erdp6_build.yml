name: ERDP-6 Closed Evidence Loop

on:
  push:
    branches:
      - phase-erdp6-closed-evidence-loop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Enforce ERDP-6 formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/exam_readiness/models/activity_evidence_stats.dart \
            lib/features/exam_readiness/models/competency_evidence_snapshot.dart \
            lib/features/exam_readiness/models/daily_study_plan.dart \
            lib/features/exam_readiness/models/learning_evidence_event.dart \
            lib/features/exam_readiness/repositories/learning_evidence_event_repository.dart \
            lib/features/exam_readiness/services/closed_evidence_loop_coordinator.dart \
            lib/features/exam_readiness/services/daily_study_plan_service.dart \
            lib/features/exam_readiness/services/learner_evidence_aggregation_service.dart \
            lib/features/exam_readiness/services/learning_evidence_normalizer.dart \
            lib/features/exam_readiness/services/learning_state_update_coordinator.dart \
            lib/features/exam_readiness/services/plan_replanning_service.dart \
            lib/features/exam_readiness/services/readiness_evidence_bootstrap_service.dart \
            lib/features/exam_readiness/services/readiness_profile_service.dart \
            lib/features/exam_readiness/screens/todays_plan_screen.dart \
            test/features/exam_readiness/erdp/erdp6_closed_evidence_loop_test.dart

      - name: Analyze ERDP-6 integrated surface
        run: |
          dart analyze \
            lib/features/exam_readiness/models/activity_evidence_stats.dart \
            lib/features/exam_readiness/models/competency_evidence_snapshot.dart \
            lib/features/exam_readiness/models/daily_study_plan.dart \
            lib/features/exam_readiness/models/learning_evidence_event.dart \
            lib/features/exam_readiness/repositories/learning_evidence_event_repository.dart \
            lib/features/exam_readiness/services/closed_evidence_loop_coordinator.dart \
            lib/features/exam_readiness/services/daily_study_plan_service.dart \
            lib/features/exam_readiness/services/learner_evidence_aggregation_service.dart \
            lib/features/exam_readiness/services/learning_evidence_normalizer.dart \
            lib/features/exam_readiness/services/learning_state_update_coordinator.dart \
            lib/features/exam_readiness/services/plan_replanning_service.dart \
            lib/features/exam_readiness/services/readiness_evidence_bootstrap_service.dart \
            lib/features/exam_readiness/services/readiness_profile_service.dart \
            lib/features/exam_readiness/screens/todays_plan_screen.dart \
            test/features/exam_readiness/erdp/erdp6_closed_evidence_loop_test.dart

      - name: Run ERDP-6 closed evidence-loop tests
        run: flutter test test/features/exam_readiness/erdp/erdp6_closed_evidence_loop_test.dart

      - name: Run ERDP-5 executable-control regression
        run: flutter test test/features/exam_readiness/erdp/erdp5_executable_daily_plan_test.dart

      - name: Run ERDP-4 execution regressions
        run: |
          flutter test test/features/exam_readiness/erdp/erdp4_execution_router_test.dart
          flutter test test/features/exam_readiness/erdp/erdp4_execution_store_test.dart

      - name: Run M7D Daily Plan regression
        run: flutter test test/features/exam_readiness/m7d

      - name: Run ERDP-3 balanced planner regressions
        run: |
          flutter test test/features/exam_readiness/erdp/erdp3_balanced_portfolio_policy_test.dart
          flutter test test/features/exam_readiness/erdp/erdp3_balanced_planner_integration_test.dart
          flutter test test/features/exam_readiness/erdp/erdp3_daily_constraints_test.dart

      - name: Run ERDP-2 Flashcard regression
        run: flutter test test/features/exam_readiness/erdp/erdp2_flashcard_execution_test.dart

      - name: Diff hygiene
        run: git diff --check
