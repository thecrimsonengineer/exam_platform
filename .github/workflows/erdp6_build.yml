name: ERDP-6 Canonical Test Formatter

on:
  push:
    branches:
      - phase-erdp6-closed-evidence-loop

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Format ERDP-6 closure test
        run: dart format test/features/exam_readiness/erdp/erdp6_closed_evidence_loop_test.dart

      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/features/exam_readiness/erdp/erdp6_closed_evidence_loop_test.dart
          git commit -m "ERDP-6 canonicalize closure test"
          git push origin HEAD:phase-erdp6-closed-evidence-loop
