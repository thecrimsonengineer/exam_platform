name: ML-9C Gate Evidence Validation

on:
  push:
    branches:
      - phase-ml9c-gate-evidence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml9c-gate-evidence-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate-ml9c:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact ML-9C SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --check HEAD^

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze ML-9C validator
        run: dart analyze tool/validate_ml9c_gate_evidence.dart

      - name: Validate complete ML-9C evidence corpus
        run: dart run tool/validate_ml9c_gate_evidence.dart

      - name: Run evidence validator regression
        shell: bash
        run: |
          set -euo pipefail
          flutter test \
            test/micro_learning/rights_evidence_validator_test.dart \
            test/micro_learning/curriculum_mapping_evidence_validator_test.dart \
            test/micro_learning/startup_pedagogy_evidence_validator_test.dart
