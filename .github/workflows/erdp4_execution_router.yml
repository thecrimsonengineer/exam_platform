name: ERDP-4 Universal Execution Router

on:
  push:
    branches:
      - phase-erdp4-universal-execution-router
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Check ERDP-4 source parse and formatting surface
        run: |
          dart format --output=none \
            lib/features/exam_readiness/models/study_plan_execution_attempt.dart \
            lib/features/exam_readiness/services/study_plan_execution_router.dart \
            test/features/exam_readiness/erdp/erdp4_execution_router_test.dart

      - name: Analyze ERDP-4 surface
        run: |
          dart analyze lib/features/exam_readiness/models/study_plan_execution_attempt.dart
          dart analyze lib/features/exam_readiness/services/study_plan_execution_router.dart
          dart analyze test/features/exam_readiness/erdp/erdp4_execution_router_test.dart

      - name: Run ERDP-4 targeted tests
        run: flutter test test/features/exam_readiness/erdp/erdp4_execution_router_test.dart

      - name: Run ERDP-3 balanced planner regression
        run: |
          flutter test test/features/exam_readiness/erdp/erdp3_balanced_portfolio_policy_test.dart
          flutter test test/features/exam_readiness/erdp/erdp3_balanced_planner_integration_test.dart
          flutter test test/features/exam_readiness/erdp/erdp3_daily_constraints_test.dart

      - name: Run ERDP-2 Flashcard execution regression
        run: flutter test test/features/exam_readiness/erdp/erdp2_flashcard_execution_test.dart

      - name: Diff hygiene
        run: git diff --check
