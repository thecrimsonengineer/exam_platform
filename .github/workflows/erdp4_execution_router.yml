name: ERDP-4 Universal Execution Router

on:
  push:
    branches:
      - phase-erdp4-universal-execution-router
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Apply canonical ERDP-4 formatting once
        run: |
          FILES="\
          lib/features/exam_readiness/models/study_plan_execution_attempt.dart \
          lib/features/exam_readiness/models/study_plan_execution_target.dart \
          lib/features/exam_readiness/repositories/daily_study_plan_repository.dart \
          lib/features/exam_readiness/services/study_plan_execution_router.dart \
          lib/features/exam_readiness/services/local_study_plan_execution_store.dart \
          lib/features/exam_readiness/navigation/study_plan_block_launcher.dart \
          lib/features/exam_readiness/navigation/flutter_study_plan_execution_navigator.dart \
          lib/features/exam_readiness/screens/todays_plan_screen.dart \
          test/features/exam_readiness/erdp/erdp4_execution_router_test.dart \
          test/features/exam_readiness/erdp/erdp4_execution_store_test.dart"
          dart format $FILES
          if ! git diff --quiet -- $FILES; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "ERDP-4 apply canonical Dart formatting"
            git push origin HEAD:phase-erdp4-universal-execution-router
          fi

      - name: Analyze ERDP-4 integrated surface
        run: |
          dart analyze \
            lib/features/exam_readiness/models/study_plan_execution_attempt.dart \
            lib/features/exam_readiness/models/study_plan_execution_target.dart \
            lib/features/exam_readiness/repositories/daily_study_plan_repository.dart \
            lib/features/exam_readiness/services/study_plan_execution_router.dart \
            lib/features/exam_readiness/services/local_study_plan_execution_store.dart \
            lib/features/exam_readiness/navigation/study_plan_block_launcher.dart \
            lib/features/exam_readiness/navigation/flutter_study_plan_execution_navigator.dart \
            lib/features/exam_readiness/screens/todays_plan_screen.dart \
            test/features/exam_readiness/erdp/erdp4_execution_router_test.dart \
            test/features/exam_readiness/erdp/erdp4_execution_store_test.dart

      - name: Run ERDP-4 transaction router tests
        run: flutter test test/features/exam_readiness/erdp/erdp4_execution_router_test.dart

      - name: Run ERDP-4 persistence and idempotency tests
        run: flutter test test/features/exam_readiness/erdp/erdp4_execution_store_test.dart

      - name: Run M7D Daily Plan regression
        run: flutter test test/features/exam_readiness/m7d

      - name: Run ERDP-3 balanced planner regression
        run: |
          flutter test test/features/exam_readiness/erdp/erdp3_balanced_portfolio_policy_test.dart
          flutter test test/features/exam_readiness/erdp/erdp3_balanced_planner_integration_test.dart
          flutter test test/features/exam_readiness/erdp/erdp3_daily_constraints_test.dart

      - name: Run ERDP-2 Flashcard execution regression
        run: flutter test test/features/exam_readiness/erdp/erdp2_flashcard_execution_test.dart

      - name: Diff hygiene
        run: git diff --check
