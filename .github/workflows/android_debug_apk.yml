name: Android Debug APK - Existing Install Update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-update-apk:
    name: Build same-signature debug update APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORIGINAL_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout glassmorphism branch
        uses: actions/checkout@v4

      - name: Require original debug signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ORIGINAL_DEBUG_KEYSTORE_BASE64}" ]; then
            echo "::error::Missing repository secret ANDROID_DEBUG_KEYSTORE_BASE64."
            echo "::error::Do not uninstall the existing Android app. Add the Base64 form of the original computer's ~/.android/debug.keystore, then run this workflow again."
            exit 1
          fi

      - name: Restore original debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.android"
          printf '%s' "${ORIGINAL_DEBUG_KEYSTORE_BASE64}" | base64 --decode > "${HOME}/.android/debug.keystore"
          chmod 600 "${HOME}/.android/debug.keystore"
          keytool -list             -keystore "${HOME}/.android/debug.keystore"             -storepass android             -alias androiddebugkey >/dev/null
          echo "Original debug keystore restored and validated."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve packages
        run: flutter pub get

      - name: Build Android debug update APK
        run: flutter build apk --debug

      - name: Prepare update artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk CSP11-glass-update-debug.apk
          sha256sum CSP11-glass-update-debug.apk > CSP11-glass-update-debug.apk.sha256
          ls -lh CSP11-glass-update-debug.apk CSP11-glass-update-debug.apk.sha256

      - name: Upload same-signature debug update APK
        uses: actions/upload-artifact@v4
        with:
          name: CSP11-glass-update-debug-apk
          path: |
            CSP11-glass-update-debug.apk
            CSP11-glass-update-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
