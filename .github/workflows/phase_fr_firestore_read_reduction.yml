name: Phase FR Firestore Read Reduction Validation

on:
  push:
    branches:
      - phase-fr-firestore-read-reduction
      - phase-fr5-shadow-data-parity
  pull_request:
    branches:
      - phase-fr3-closed
      - phase-fr4-closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-fr-firestore-read-reduction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Dependency lock gate
        run: git diff --exit-code -- pubspec.lock

      - name: FR formatting gate
        run: |
          dart format \
            lib/services/performance/firestore_read_audit.dart \
            lib/services/auth/user_role_service.dart \
            lib/services/cloud_question_repository.dart \
            lib/services/study_content/cloud_content_repository.dart \
            lib/features/exam_readiness/repositories/daily_study_plan_repository.dart \
            lib/features/exam_readiness/repositories/exam_study_plan_repository.dart \
            lib/features/exam_readiness/repositories/readiness_snapshot_repository.dart \
            test/services/performance/firestore_read_audit_test.dart \
            test/architecture/phase_fr_local_data_preservation_test.dart \
            lib/services/supabase/supabase_runtime_config.dart \
            lib/services/supabase/supabase_bootstrap_service.dart \
            lib/services/supabase/supabase_learner_remote_authorization_probe.dart \
            lib/main.dart \
            lib/services/online_access/learner_online_access_gate.dart \
            lib/services/online_access/firebase_learner_access_token_provider.dart \
            test/services/supabase/supabase_runtime_config_test.dart \
            test/services/supabase/supabase_bootstrap_service_test.dart \
            test/services/supabase/supabase_learner_remote_authorization_probe_test.dart \
            test/services/online_access/learner_online_access_gate_test.dart \
            test/architecture/phase_fr_edge_auth_gateway_test.dart \
            test/architecture/phase_fr_supabase_schema_test.dart \
            tool/fr4_migration/fr4_migration_core.dart \
            tool/fr4_migration/fr4_migrate.dart \
            test/tool/fr4_migration_core_test.dart \
            tool/fr5_shadow_parity/fr5_shadow_parity_core.dart \
            tool/fr5_shadow_parity/fr5_shadow_parity.dart \
            test/tool/fr5_shadow_parity_core_test.dart \
            test/architecture/phase_fr5_shadow_parity_architecture_test.dart
          git diff --
          git diff --exit-code -- \
            lib/services/performance/firestore_read_audit.dart \
            lib/services/auth/user_role_service.dart \
            lib/services/cloud_question_repository.dart \
            lib/services/study_content/cloud_content_repository.dart \
            lib/features/exam_readiness/repositories/daily_study_plan_repository.dart \
            lib/features/exam_readiness/repositories/exam_study_plan_repository.dart \
            lib/features/exam_readiness/repositories/readiness_snapshot_repository.dart \
            test/services/performance/firestore_read_audit_test.dart \
            test/architecture/phase_fr_local_data_preservation_test.dart \
            lib/services/supabase/supabase_runtime_config.dart \
            lib/services/supabase/supabase_bootstrap_service.dart \
            lib/services/supabase/supabase_learner_remote_authorization_probe.dart \
            lib/main.dart \
            lib/services/online_access/learner_online_access_gate.dart \
            lib/services/online_access/firebase_learner_access_token_provider.dart \
            test/services/supabase/supabase_runtime_config_test.dart \
            test/services/supabase/supabase_bootstrap_service_test.dart \
            test/services/supabase/supabase_learner_remote_authorization_probe_test.dart \
            test/services/online_access/learner_online_access_gate_test.dart \
            test/architecture/phase_fr_edge_auth_gateway_test.dart \
            test/architecture/phase_fr_supabase_schema_test.dart \
            tool/fr4_migration/fr4_migration_core.dart \
            tool/fr4_migration/fr4_migrate.dart \
            test/tool/fr4_migration_core_test.dart \
            tool/fr5_shadow_parity/fr5_shadow_parity_core.dart \
            tool/fr5_shadow_parity/fr5_shadow_parity.dart \
            test/tool/fr5_shadow_parity_core_test.dart \
            test/architecture/phase_fr5_shadow_parity_architecture_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: FR1 read audit tests
        run: flutter test test/services/performance/firestore_read_audit_test.dart

      - name: FR learner local data preservation gate
        run: flutter test test/architecture/phase_fr_local_data_preservation_test.dart

      - name: FR2 foundation unit tests
        run: |
          flutter test test/services/supabase/supabase_runtime_config_test.dart
          flutter test test/services/supabase/supabase_bootstrap_service_test.dart
          flutter test test/services/supabase/supabase_learner_remote_authorization_probe_test.dart
          flutter test test/services/online_access/learner_online_access_gate_test.dart
          flutter test test/architecture/phase_fr_edge_auth_gateway_test.dart

      - name: FR3 schema architecture gate
        run: flutter test test/architecture/phase_fr_supabase_schema_test.dart

      - name: FR4 deterministic migration unit tests
        run: |
          flutter test test/tool/fr4_migration_core_test.dart
          flutter test test/architecture/phase_fr4_migration_architecture_test.dart

      - name: FR4 deterministic fixture plan gate
        run: |
          rm -rf build/fr4
          dart run tool/fr4_migration/fr4_migrate.dart \
            --input=test/fixtures/fr4/source_documents.json \
            --evidence=build/fr4/fr4_migration_evidence.json
          test -s build/fr4/fr4_migration_evidence.json
          grep -q '"readyToApply": true' build/fr4/fr4_migration_evidence.json
          grep -q '"issueCount": 0' build/fr4/fr4_migration_evidence.json

      - name: FR5 shadow parity unit tests
        run: |
          flutter test test/tool/fr5_shadow_parity_core_test.dart
          flutter test test/architecture/phase_fr5_shadow_parity_architecture_test.dart

      - name: FR5 deterministic fixture parity gate
        run: |
          rm -rf build/fr5
          mkdir -p build/fr5
          dart run tool/fr4_migration/fr4_migrate.dart \
            --input=test/fixtures/fr4/source_documents.json \
            --evidence=build/fr5/fr4_plan.json
          dart run tool/fr5_shadow_parity/fr5_shadow_parity.dart \
            --fr4-evidence=build/fr5/fr4_plan.json \
            --target=test/fixtures/fr5/target_snapshot.json \
            --evidence=build/fr5/fr5_parity.json
          test -s build/fr5/fr5_parity.json
          grep -q '"completeParity": true' build/fr5/fr5_parity.json
          grep -q '"missingCount": 0' build/fr5/fr5_parity.json
          grep -q '"checksumMismatchCount": 0' build/fr5/fr5_parity.json
          grep -q '"learnerVisibleMismatchCount": 0' build/fr5/fr5_parity.json
          grep -q '"ledgerMismatchCount": 0' build/fr5/fr5_parity.json

      - name: Preserve frozen Phase L4 learner regressions
        run: flutter test test/screens/lab

      - name: Preserve frozen Phase L4 quality gates
        run: flutter test test/lab_quality

      - name: Preserve exact frozen Phase L engine suite
        run: flutter test test/features/lab

      - name: Full repository regression
        run: flutter test

      - name: Diff hygiene
        run: git diff --check
