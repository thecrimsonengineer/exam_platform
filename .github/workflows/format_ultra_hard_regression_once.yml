name: Format Ultra Hard Regression Once

on:
  push:
    branches:
      - phase-m7-exam-readiness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-m7-exam-readiness
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Format regression test
        run: dart format test/services/practice_mode_service_test.dart

      - name: Commit formatter result
        run: |
          if git diff --quiet -- test/services/practice_mode_service_test.dart; then
            echo "Already formatted."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/services/practice_mode_service_test.dart
          git commit -m "Format Ultra Hard regression test"
          git push origin HEAD:phase-m7-exam-readiness
