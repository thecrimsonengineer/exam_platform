name: Phase L2 One Shot Formatter

on:
  push:
    branches:
      - phase-l-lab-engine

permissions:
  contents: write

concurrency:
  group: phase-l2-format-once
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Format corrected L2 files
        run: |
          dart format \
            lib/features/lab/lab_validation.dart \
            lib/screens/admin/lab/lab1000_studio_screen.dart

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Corrected L2 files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/lab/lab_validation.dart lib/screens/admin/lab/lab1000_studio_screen.dart
          git commit -m "Format corrected Phase L2 files"
          git push origin HEAD:phase-l-lab-engine
