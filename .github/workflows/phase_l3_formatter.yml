name: Phase L3 One Shot Formatter

on:
  push:
    branches:
      - phase-l-lab-engine

permissions:
  contents: write

concurrency:
  group: phase-l3-formatter
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Canonical Dart format
        run: |
          dart format \
            lib/features/lab \
            lib/screens/lab \
            lib/screens/admin/lab \
            test/features/lab

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/lab lib/screens/lab lib/screens/admin/lab test/features/lab
          git commit -m "Format Phase L3 closure files"
          git push origin HEAD:phase-l-lab-engine
