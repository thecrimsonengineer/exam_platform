name: M7C Screen Formatter

permissions:
  contents: write

on:
  push:
    branches:
      - phase-m7-exam-readiness

jobs:
  format-screen:
    if: ${{ !startsWith(github.event.head_commit.message, 'Format M7C readiness screen') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-m7-exam-readiness
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Format screen
        run: dart format lib/features/exam_readiness/screens/readiness_profile_screen.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/exam_readiness/screens/readiness_profile_screen.dart
          git commit -m "Format M7C readiness screen"
          git push origin HEAD:phase-m7-exam-readiness
