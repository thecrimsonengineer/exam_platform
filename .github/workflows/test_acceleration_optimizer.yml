name: CSP11 Test Accelerator Optimizer

on:
  push:
    branches:
      - phase-test-acceleration-engine
    paths:
      - .github/workflows/test_acceleration_optimizer.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact accelerator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Apply tested accelerator optimizations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path('tools/test_acceleration/csp11_test_accelerator.py')
          engine = engine_path.read_text(encoding='utf-8')

          old_refs = '''def resolve_ref(root: Path, ref: str) -> str:\n    return _run_git(root, ["rev-parse", ref])\n\n\ndef changed_files(root: Path, base: str, head: str) -> list[str]:\n    try:\n        output = _run_git(root, ["diff", "--name-only", f"{base}...{head}"])\n    except subprocess.CalledProcessError:\n        output = _run_git(root, ["diff", "--name-only", base, head])\n    return sorted({_norm(line) for line in output.splitlines() if line.strip()})\n'''
          new_refs = '''def resolve_ref(root: Path, ref: str) -> str:\n    if ref == "WORKTREE":\n        return _run_git(root, ["rev-parse", "HEAD"])\n    return _run_git(root, ["rev-parse", ref])\n\n\ndef changed_files(root: Path, base: str, head: str) -> list[str]:\n    if head == "WORKTREE":\n        tracked = _run_git(root, ["diff", "--name-only", base])\n        untracked = _run_git(root, ["ls-files", "--others", "--exclude-standard"])\n        return sorted(\n            {\n                _norm(line)\n                for line in (*tracked.splitlines(), *untracked.splitlines())\n                if line.strip()\n            }\n        )\n\n    try:\n        output = _run_git(root, ["diff", "--name-only", f"{base}...{head}"])\n    except subprocess.CalledProcessError:\n        output = _run_git(root, ["diff", "--name-only", base, head])\n    return sorted({_norm(line) for line in output.splitlines() if line.strip()})\n'''
          if old_refs not in engine:
              raise SystemExit('resolve_ref/changed_files patch anchor not found')
          engine = engine.replace(old_refs, new_refs, 1)

          old_command = '''        "flutter",\n        "test",\n        "--reporter",\n'''
          new_command = '''        "flutter",\n        "test",\n        "--no-pub",\n        "--reporter",\n'''
          if old_command not in engine:
              raise SystemExit('flutter test command patch anchor not found')
          engine = engine.replace(old_command, new_command, 1)

          old_local = '''    local = sub.add_parser("local", help="Plan and run adaptive tests locally.")\n    local.add_argument("--base", default="HEAD~1")\n    local.add_argument("--head", default="HEAD")\n'''
          new_local = '''    local = sub.add_parser("local", help="Plan and run adaptive tests locally.")\n    local.add_argument("--base", default="HEAD")\n    local.add_argument("--head", default="WORKTREE")\n'''
          if old_local not in engine:
              raise SystemExit('local default patch anchor not found')
          engine = engine.replace(old_local, new_local, 1)
          engine_path.write_text(engine, encoding='utf-8')

          test_path = Path('tools/test_acceleration/test_csp11_test_accelerator.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '''    def test_lpt_sharding_balances_slowest_tests_first(self) -> None:\n'''
          addition = '''    def test_worktree_mode_detects_tracked_and_untracked_edits(self) -> None:\n        temp, root = self._repo()\n        self.addCleanup(temp.cleanup)\n\n        self._write(root, "lib/a.dart", "const value = 1;\\n")\n        _git(root, "add", ".")\n        _git(root, "commit", "-m", "base")\n\n        self._write(root, "lib/a.dart", "const value = 2;\\n")\n        self._write(root, "lib/new_file.dart", "const fresh = true;\\n")\n\n        changed = ACCEL.changed_files(root, "HEAD", "WORKTREE")\n\n        self.assertEqual(["lib/a.dart", "lib/new_file.dart"], changed)\n        self.assertEqual(_git(root, "rev-parse", "HEAD"), ACCEL.resolve_ref(root, "WORKTREE"))\n\n'''
          if anchor not in tests:
              raise SystemExit('worktree test insertion anchor not found')
          tests = tests.replace(anchor, addition + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')

          ps_path = Path('tools/test_acceleration/csp11_fast_test.ps1')
          ps = ps_path.read_text(encoding='utf-8')
          ps = ps.replace('[string]$Base = "HEAD~1"', '[string]$Base = "HEAD"', 1)
          ps = ps.replace('[string]$Head = "HEAD"', '[string]$Head = "WORKTREE"', 1)
          ps_path.write_text(ps, encoding='utf-8')

          readme_path = Path('tools/test_acceleration/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'That runs the tests impacted by the previous commit.',
              'That runs the tests impacted by your current staged, unstaged, and untracked working-tree changes.',
              1,
          )
          readme = readme.replace(
              '6. **One Flutter process per batch**  \\n   Selected tests are grouped together instead of launching `flutter test` repeatedly for every file. This reduces compiler/startup overhead.',
              '6. **One Flutter process per batch**  \\n   Selected tests are grouped together instead of launching `flutter test` repeatedly for every file. This reduces compiler/startup overhead. After the explicit package restore, shard execution uses `flutter test --no-pub` so dependency resolution is not repeated.',
              1,
          )
          readme = readme.replace(
              '# Current change only, normal development default',
              '# Current working-tree changes, normal development default',
              1,
          )
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Validate accelerator unit tests
        run: python tools/test_acceleration/test_csp11_test_accelerator.py

      - name: Resolve packages once
        run: flutter pub get

      - name: Prove no-pub smoke execution against working tree
        shell: bash
        run: |
          python tools/test_acceleration/csp11_test_accelerator.py local \
            --mode smoke \
            --base HEAD \
            --head WORKTREE \
            --shards 1 \
            --workers 1 \
            --concurrency 4

      - name: Verify dependency graph stays stable
        run: git diff --exit-code -- pubspec.lock

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit verified optimizer result and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/test_acceleration_optimizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/test_acceleration/csp11_test_accelerator.py \
            tools/test_acceleration/test_csp11_test_accelerator.py \
            tools/test_acceleration/csp11_fast_test.ps1 \
            tools/test_acceleration/README.md \
            .github/workflows/test_acceleration_optimizer.yml
          git commit -m "Optimize adaptive test feedback loop"
          git push origin HEAD:phase-test-acceleration-engine
