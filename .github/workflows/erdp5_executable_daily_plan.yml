name: ERDP-5 Canonical Formatter

on:
  push:
    branches:
      - phase-erdp5-executable-daily-plan

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Format repository source
        run: dart format lib/features/exam_readiness/repositories/daily_study_plan_repository.dart
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/exam_readiness/repositories/daily_study_plan_repository.dart
          git commit -m "ERDP-5 canonicalize repository formatting"
          git push origin HEAD:phase-erdp5-executable-daily-plan
