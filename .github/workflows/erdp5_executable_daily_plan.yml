name: ERDP-5 Idempotency Repair

on:
  push:
    branches:
      - phase-erdp5-executable-daily-plan

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply remote save idempotency repair
        run: |
          python3 -c "from pathlib import Path; p=Path('lib/features/exam_readiness/repositories/daily_study_plan_repository.dart'); s=p.read_text(); s=s.replace('    final history = state.plans.toList();\\n    _appendPlanImmutable(history, plan);\\n','    final history = state.plans.toList();\\n    final planWasAdded = _appendPlanImmutable(history, plan);\\n',1); s=s.replace('    if (syncRemote && _remoteStore != null) {\\n      await _remoteStore.savePlan(plan);\\n    }\\n','    if (syncRemote && _remoteStore != null && planWasAdded) {\\n      await _remoteStore.savePlan(plan);\\n    }\\n',1); old='  void _appendPlanImmutable(List<DailyStudyPlan> history, DailyStudyPlan plan) {\\n    final sameVersion = history.where(\\n      (item) =>\\n          item.planId == plan.planId && item.planVersion == plan.planVersion,\\n    );\\n\\n    if (sameVersion.isNotEmpty) {\\n      if (jsonEncode(sameVersion.first.toJson()) != jsonEncode(plan.toJson())) {\\n        throw StateError(\\'Daily plan history is immutable.\\');\\n      }\\n      return;\\n    }\\n\\n    history.add(plan);\\n    history.sort(_newestFirst);\\n  }\\n'; new='  bool _appendPlanImmutable(\\n    List<DailyStudyPlan> history,\\n    DailyStudyPlan plan,\\n  ) {\\n    final sameVersion = history.where(\\n      (item) =>\\n          item.planId == plan.planId && item.planVersion == plan.planVersion,\\n    );\\n\\n    if (sameVersion.isNotEmpty) {\\n      if (jsonEncode(sameVersion.first.toJson()) != jsonEncode(plan.toJson())) {\\n        throw StateError(\\'Daily plan history is immutable.\\');\\n      }\\n      return false;\\n    }\\n\\n    history.add(plan);\\n    history.sort(_newestFirst);\\n    return true;\\n  }\\n'; assert old in s, 'immutable append method missing'; p.write_text(s.replace(old,new,1))"
          dart format lib/features/exam_readiness/repositories/daily_study_plan_repository.dart || true
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/exam_readiness/repositories/daily_study_plan_repository.dart
          git commit -m "ERDP-5 preserve remote save idempotency"
          git push origin HEAD:phase-erdp5-executable-daily-plan
