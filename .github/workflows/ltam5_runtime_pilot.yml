name: LTAM-5 Runtime Pilot

on:
  push:
    branches:
      - phase-ml-ltam5-runtime-pilot
      - phase-ml-ltam5-hero-pilot-gated
      - phase-ml-ltam5-hero-asset-admission
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ltam5-runtime-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact LTAM-5 SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact baseline and protected boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor d3b4529501bd1a1e9c5059e133b98bafda885da0 HEAD
          git diff --check d3b4529501bd1a1e9c5059e133b98bafda885da0 HEAD
          git diff --quiet d3b4529501bd1a1e9c5059e133b98bafda885da0 HEAD -- content/micro_learning/facts
          git diff --quiet d3b4529501bd1a1e9c5059e133b98bafda885da0 HEAD -- lib/features/learning_twin/domain
          git diff --quiet d3b4529501bd1a1e9c5059e133b98bafda885da0 HEAD -- lib/features/learning_twin/coaching
          git diff --quiet d3b4529501bd1a1e9c5059e133b98bafda885da0 HEAD -- lib/features/learning_twin/integration
          git diff --quiet d3b4529501bd1a1e9c5059e133b98bafda885da0 HEAD -- lib/screens/startup/startup_micro_fact_card.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Normalize LTAM-5 files
        run: |
          dart format             lib/features/learning_twin/ui/learning_twin_avatar.dart             lib/features/learning_twin/ui/learning_twin_hero.dart             lib/features/learning_twin/ui/learning_twin_idle_asset_contract.dart             lib/features/learning_twin/ui/learning_twin_motion_renderer.dart             lib/features/learning_twin/ui/learning_twin_motion_rollout.dart             lib/features/learning_twin/ui/learning_twin_ui.dart             test/features/learning_twin/ui/learning_twin_hero_motion_pilot_test.dart             test/features/learning_twin/ui/learning_twin_motion_rollout_test.dart             test/features/learning_twin/ui/learning_twin_motion_asset_admission_test.dart             test/features/learning_twin/ui/learning_twin_idle_asset_contract_test.dart             test/features/learning_twin/ui/learning_twin_idle_asset_contract_test.dart             test/features/learning_twin/ui/learning_twin_ltam5_architecture_guard_test.dart

      - name: Analyze LTAM-5 slice
        run: |
          dart analyze             lib/features/learning_twin/ui/learning_twin_avatar.dart             lib/features/learning_twin/ui/learning_twin_hero.dart             lib/features/learning_twin/ui/learning_twin_motion_renderer.dart             lib/features/learning_twin/ui/learning_twin_motion_rollout.dart             test/features/learning_twin/ui/learning_twin_hero_motion_pilot_test.dart             test/features/learning_twin/ui/learning_twin_motion_rollout_test.dart             test/features/learning_twin/ui/learning_twin_ltam5_architecture_guard_test.dart

      - name: Run LTAM-5 focused tests
        run: |
          flutter test             test/features/learning_twin/ui/learning_twin_motion_rollout_test.dart             test/features/learning_twin/ui/learning_twin_motion_asset_admission_test.dart             test/features/learning_twin/ui/learning_twin_hero_motion_pilot_test.dart             test/features/learning_twin/ui/learning_twin_ltam5_architecture_guard_test.dart             test/features/learning_twin/ui/learning_twin_avatar_motion_compatibility_test.dart             test/features/learning_twin/ui/learning_twin_motion_renderer_test.dart             test/features/learning_twin/ui/learning_twin_motion_policy_test.dart             test/features/learning_twin/ui/learning_twin_motion_controller_test.dart

      - name: Revalidate complete Learning Twin
        run: flutter test test/features/learning_twin

      - name: Revalidate ML LTAM integration seam
        run: |
          flutter test             test/features/learning_twin/integration/micro_learning_twin_presentation_test.dart             test/features/learning_twin/integration/micro_learning_startup_avatar_integration_test.dart             test/features/learning_twin/integration/micro_learning_twin_architecture_guard_test.dart

      - name: Revalidate startup static boundary
        run: |
          flutter test             test/startup/startup_micro_fact_card_test.dart             test/startup/startup_micro_fact_integration_test.dart             test/startup/startup_micro_fact_motion_unit_test.dart             test/startup/startup_micro_fact_motion_integration_test.dart

      - name: Run full Flutter regression
        id: full_regression
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee /tmp/ltam5_full_regression.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Prove inherited baseline-only regression debt
        if: steps.full_regression.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail

          grep -F "test/integration/home_startup/int_r4_dependencies_assets_platform_test.dart" /tmp/ltam5_full_regression.log
          grep -F "test/integration/home_startup/int_r9a3_supabase_bootstrap_verification_test.dart" /tmp/ltam5_full_regression.log
          grep -E "[0-9]+ tests passed, 2 failed, 1 skipped\." /tmp/ltam5_full_regression.log
          test "$(grep -c "❌" /tmp/ltam5_full_regression.log)" -eq 2

          git worktree add --detach /tmp/ltam5-baseline d3b4529501bd1a1e9c5059e133b98bafda885da0
          cd /tmp/ltam5-baseline
          flutter pub get

          set +e
          flutter test test/integration/home_startup/int_r4_dependencies_assets_platform_test.dart
          android_status=$?
          flutter test test/integration/home_startup/int_r9a3_supabase_bootstrap_verification_test.dart
          supabase_status=$?
          set -e

          test "$android_status" -ne 0
          test "$supabase_status" -ne 0

          echo "::warning::Full regression has exactly two failures and both reproduce on the frozen LTAM-4 baseline."

      - name: Build Web release
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Final diff hygiene
        run: git diff --check

      - name: Commit formatter normalization
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --             lib/features/learning_twin/ui             test/features/learning_twin/ui; then
            echo "LTAM-5 files are already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/learning_twin/ui
          git add test/features/learning_twin/ui
          git commit -m "LTAM-5 normalize Hero pilot slice"
          git push origin HEAD:${GITHUB_REF_NAME}


  windows_fallback_validation:
    name: Windows fallback validation
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact LTAM-5 SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify LTAM-5 ancestry
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${env:GITHUB_SHA}") {
            throw "Checkout SHA does not match GITHUB_SHA."
          }
          git merge-base --is-ancestor d3b4529501bd1a1e9c5059e133b98bafda885da0 HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "LTAM-5 branch is not descended from the frozen LTAM-4 closure."
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Validate Hero admission and fallback
        run: |
          flutter test test/features/learning_twin/ui/learning_twin_motion_asset_admission_test.dart
          flutter test test/features/learning_twin/ui/learning_twin_idle_asset_contract_test.dart
          flutter test test/features/learning_twin/ui/learning_twin_hero_motion_pilot_test.dart
          flutter test test/features/learning_twin/ui/learning_twin_avatar_motion_compatibility_test.dart

      - name: Build Windows
        run: flutter build windows
