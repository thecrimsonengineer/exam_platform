name: Phase HAP Haptics Validation

on:
  push:
    branches:
      - phase-hap-haptics-system

permissions:
  contents: write

concurrency:
  group: phase-hap-haptics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Apply canonical formatting
        run: |
          dart format lib/main.dart lib/services/haptics lib/services/settings/haptic_preference_service.dart lib/screens/navigation/bottom_navigation.dart lib/screens/settings/settings_screen.dart lib/screens/settings/settings_screen_dark.dart test/services/haptics test/services/settings/haptic_preference_service_test.dart
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/main.dart lib/services/haptics lib/services/settings/haptic_preference_service.dart lib/screens/navigation/bottom_navigation.dart lib/screens/settings/settings_screen.dart lib/screens/settings/settings_screen_dark.dart test/services/haptics test/services/settings/haptic_preference_service_test.dart
            git commit -m "HAP: apply canonical formatter output"
            git push
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Haptic foundation tests
        run: |
          flutter test test/services/settings/haptic_preference_service_test.dart
          flutter test test/services/haptics/csp11_haptic_service_test.dart
          flutter test test/services/haptics/csp11_haptics_run1_contract_test.dart

      - name: Settings regression tests
        run: |
          flutter test test/screens/settings/csp11_settings_p5_contract_test.dart
          flutter test test/screens/settings/csp11_settings_p6_dark_mode_contract_test.dart
          flutter test test/screens/settings/csp11_settings_interaction_test.dart
