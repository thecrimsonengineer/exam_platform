name: LSP Unified LAB Question Validation

on:
  push:
    branches:
      - phase-l4-scenario-population
      - phase-lsp-q17-production-deployment-preflight
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lsp-question-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Canonical LSP formatting
        run: |
          dart format \
            lib/services/questions/canonical_question_parser.dart \
            lib/services/studio/studio_question_import_service.dart \
            lib/features/lab/lab_decision_question_adapter.dart \
            lib/features/lab/lab_canonical_decision_batch_parser.dart \
            lib/features/lab/lab_h0_3_strict_gate.dart \
            lib/features/lab/lab_decision_quality_gate.dart \
            lib/features/lab/lab_learner_presentation.dart \
            lib/features/lab/lab_scenario_population_manifest.dart \
            lib/features/lab/lab_scenario_population_publication.dart \
            lib/features/lab/lab_learner_catalogue.dart \
            lib/features/lab/lab_firestore_repositories.dart \
            lib/features/lab/lab_runtime_binding.dart \
            lib/features/lab/lab_production_population_seed.dart \
            lib/features/lab/lab_production_release_closure.dart \
            lib/features/lab/lab_production_release_operator.dart \
            lib/features/lab/lab_production_deployment_acceptance.dart \
            lib/screens/admin/lab/lab_production_release_screen.dart \
            lib/screens/admin/lab/lab_production_deployment_acceptance_screen.dart \
            lib/screens/lab/lab_scenario_catalog.dart \
            lib/screens/lab/lab_library_screen.dart \
            lib/screens/lab/lab_scenario_briefing_screen.dart \
            lib/screens/lab/lab_player_shell_screen.dart \
            lib/screens/lab/lab_reference_player_screen.dart \
            lib/features/lab/lab_dqg300.dart \
            test/services/questions/canonical_question_parser_test.dart \
            test/lab_quality/lsp_q2_lab_decision_question_adapter_test.dart \
            test/lab_quality/lsp_q3_evidence_backed_rationale_test.dart \
            test/lab_quality/lsp_q4_canonical_decision_batch_parse_test.dart \
            test/lab_quality/lsp_q5_strict_h0_3_gate_test.dart \
            test/lab_quality/lsp_q6_combined_decision_quality_gate_test.dart \
            test/lab_quality/lsp_q7_dqg300_semantic_authority_test.dart \
            test/lab_quality/lsp_q8_learner_presentation_validation_test.dart \
            test/lab_quality/lsp_q9_scenario_population_manifest_test.dart \
            test/lab_quality/lsp_q10_manifest_backed_scenario_population_test.dart \
            test/lab_quality/lsp_q11_population_publication_gate_test.dart \
            test/lab_quality/lsp_q12_learner_catalogue_delivery_test.dart \
            test/lab_quality/lsp_q13_persistent_runtime_binding_test.dart \
            test/lab_quality/lsp_q14_production_population_seed_test.dart \
            test/lab_quality/lsp_q15_production_release_closure_test.dart \
            test/lab_quality/lsp_q16_production_release_operator_test.dart \
            test/lab_quality/lsp_q17_production_deployment_acceptance_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Canonical question parser tests
        run: flutter test test/services/questions/canonical_question_parser_test.dart

      - name: LAB decision adapter tests
        run: flutter test test/lab_quality/lsp_q2_lab_decision_question_adapter_test.dart

      - name: Evidence-backed LAB rationale tests
        run: flutter test test/lab_quality/lsp_q3_evidence_backed_rationale_test.dart

      - name: Canonical LAB Decision batch parse tests
        run: flutter test test/lab_quality/lsp_q4_canonical_decision_batch_parse_test.dart

      - name: Strict H0.3 LAB gate tests
        run: flutter test test/lab_quality/lsp_q5_strict_h0_3_gate_test.dart

      - name: Frozen H0.3 validator regression
        run: flutter test test/services/question_quality_validator_test.dart

      - name: DQG300 LAB adapter regression
        run: flutter test test/lab_quality/l4k_dqg300_lab_gate_test.dart

      - name: Combined LAB Decision quality gate tests
        run: flutter test test/lab_quality/lsp_q6_combined_decision_quality_gate_test.dart

      - name: DQG300 semantic authority tests
        run: flutter test test/lab_quality/lsp_q7_dqg300_semantic_authority_test.dart

      - name: Learner presentation validation tests
        run: flutter test test/lab_quality/lsp_q8_learner_presentation_validation_test.dart

      - name: Scenario population manifest tests
        run: flutter test test/lab_quality/lsp_q9_scenario_population_manifest_test.dart

      - name: Manifest-backed scenario population tests
        run: flutter test test/lab_quality/lsp_q10_manifest_backed_scenario_population_test.dart

      - name: Population publication gate tests
        run: flutter test test/lab_quality/lsp_q11_population_publication_gate_test.dart

      - name: Learner catalogue controlled delivery tests
        run: flutter test test/lab_quality/lsp_q12_learner_catalogue_delivery_test.dart

      - name: Persistent learner runtime binding tests
        run: flutter test test/lab_quality/lsp_q13_persistent_runtime_binding_test.dart

      - name: Controlled production population seed tests
        run: flutter test test/lab_quality/lsp_q14_production_population_seed_test.dart

      - name: Production release closure tests
        run: flutter test test/lab_quality/lsp_q15_production_release_closure_test.dart

      - name: Production release operator tests
        run: flutter test test/lab_quality/lsp_q16_production_release_operator_test.dart

      - name: Production deployment acceptance tests
        run: flutter test test/lab_quality/lsp_q17_production_deployment_acceptance_test.dart

      - name: Studio import regression
        run: flutter test test/services/studio_question_import_service_test.dart

      - name: Studio service regression
        run: flutter test test/services/studio_question_service_test.dart

      - name: Full repository regression
        run: flutter test

      - name: Diff hygiene
        run: git diff --check

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/services/questions/canonical_question_parser.dart \
            lib/services/studio/studio_question_import_service.dart \
            lib/features/lab/lab_decision_question_adapter.dart \
            lib/features/lab/lab_canonical_decision_batch_parser.dart \
            lib/features/lab/lab_h0_3_strict_gate.dart \
            lib/features/lab/lab_decision_quality_gate.dart \
            lib/features/lab/lab_learner_presentation.dart \
            lib/features/lab/lab_scenario_population_manifest.dart \
            lib/features/lab/lab_scenario_population_publication.dart \
            lib/features/lab/lab_learner_catalogue.dart \
            lib/features/lab/lab_firestore_repositories.dart \
            lib/features/lab/lab_runtime_binding.dart \
            lib/features/lab/lab_production_population_seed.dart \
            lib/features/lab/lab_production_release_closure.dart \
            lib/features/lab/lab_production_release_operator.dart \
            lib/screens/admin/lab/lab_production_release_screen.dart \
            lib/screens/lab/lab_scenario_catalog.dart \
            lib/screens/lab/lab_library_screen.dart \
            lib/screens/lab/lab_scenario_briefing_screen.dart \
            lib/screens/lab/lab_player_shell_screen.dart \
            lib/screens/lab/lab_reference_player_screen.dart \
            lib/features/lab/lab_dqg300.dart \
            test/services/questions/canonical_question_parser_test.dart \
            test/lab_quality/lsp_q2_lab_decision_question_adapter_test.dart \
            test/lab_quality/lsp_q3_evidence_backed_rationale_test.dart \
            test/lab_quality/lsp_q4_canonical_decision_batch_parse_test.dart \
            test/lab_quality/lsp_q5_strict_h0_3_gate_test.dart \
            test/lab_quality/lsp_q6_combined_decision_quality_gate_test.dart \
            test/lab_quality/lsp_q7_dqg300_semantic_authority_test.dart \
            test/lab_quality/lsp_q8_learner_presentation_validation_test.dart \
            test/lab_quality/lsp_q9_scenario_population_manifest_test.dart \
            test/lab_quality/lsp_q10_manifest_backed_scenario_population_test.dart \
            test/lab_quality/lsp_q11_population_publication_gate_test.dart \
            test/lab_quality/lsp_q12_learner_catalogue_delivery_test.dart \
            test/lab_quality/lsp_q13_persistent_runtime_binding_test.dart \
            test/lab_quality/lsp_q14_production_population_seed_test.dart \
            test/lab_quality/lsp_q15_production_release_closure_test.dart \
            test/lab_quality/lsp_q16_production_release_operator_test.dart \
            test/lab_quality/lsp_q17_production_deployment_acceptance_test.dart
          git commit -m "Format LSP unified question quality files"
          git push origin HEAD:${GITHUB_REF_NAME}
