name: ERDP-9 Formatter Diagnostic

on:
  push:
    branches:
      - phase-erdp9-closed-loop-retention-intelligence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Print exact ERDP-9 formatter delta
        run: |
          dart format \
            lib/features/flashcards/learning/flashcard_recall_event.dart \
            lib/features/flashcards/learning/flashcard_recall_event_repository.dart
          git diff -- \
            lib/features/flashcards/learning/flashcard_recall_event.dart \
            lib/features/flashcards/learning/flashcard_recall_event_repository.dart
          exit 1
