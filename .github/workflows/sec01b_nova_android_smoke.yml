name: SEC-01B Nova Android Migration Smoke

on:
  push:
    branches:
      - phase-sec01-play-release-foundation
    paths:
      - 'android/app/build.gradle.kts'
      - 'android/app/google-services.json'
      - 'android/app/src/main/**'
      - 'firebase.json'
      - 'lib/firebase_options.dart'
      - 'lib/main.dart'
      - 'tools/security/sec01b_android_identity.py'
      - '.github/workflows/sec01b_nova_android_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec01b-nova-android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-smoke:
    name: Validate new Android ID, auth tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: 'https://esfycnmfywxczfillioj.supabase.co'
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout isolated SEC-01 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen ancestry, Gradle package and Firebase registration
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 156ea074e1f420672490511a01117804dc22ce74 HEAD
          python tools/security/sec01b_android_identity.py --mode release
          git diff --check

      - name: Require public Supabase client configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_URL" = "https://esfycnmfywxczfillioj.supabase.co"
          case "${SUPABASE_PUBLISHABLE_KEY:-}" in
            sb_publishable_*) ;;
            *) echo "::error::A public sb_publishable_ key is required for auth smoke testing."; exit 1 ;;
          esac

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Analyze Android startup and authorisation code
        run: |
          flutter analyze --no-fatal-infos \
            lib/main.dart lib/firebase_options.dart \
            lib/screens/auth lib/services/online_access lib/services/supabase

      - name: Run existing Firebase + protected-content regression tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/services/supabase/supabase_bootstrap_service_test.dart
          flutter test test/services/online_access/learner_online_access_gate_test.dart
          flutter test test/services/online_access/learner_online_access_session_controller_test.dart
          flutter test test/screens/auth/learner_authorized_shell_test.dart

      - name: Compile Android debug APK for package and Firebase smoke verification
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify Android package ID and Nova application label
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" > "${RUNNER_TEMP}/nova-debug-badging.txt"
          grep -Fq "name='com.csp11.examplatform'" "${RUNNER_TEMP}/nova-debug-badging.txt"
          grep -Fq "application-label:'CSP 11 Nova: CSP Exam Prep.'" "${RUNNER_TEMP}/nova-debug-badging.txt"
          {
            echo "SEC01B_NOVA_ANDROID_DEBUG_SMOKE=PASS"
            echo "SHA=${GITHUB_SHA}"
            echo "PACKAGE=com.csp11.examplatform"
            echo "FIREBASE_ANDROID_APP_ID=1:984608502679:android:99d154c5e5f6d083ca0ad2"
            echo "GOOGLE_SIGN_IN_ANDROID_SHA1=REGISTERED; PLAY_CERT=NOT_YET_VERIFIED"
            sha256sum "$APK"
          } > sec01b-nova-debug-evidence.txt

      - name: Upload debug-only smoke APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: CSP11-Nova-SEC01B-debug-smoke-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            sec01b-nova-debug-evidence.txt
          if-no-files-found: error
          retention-days: 7
