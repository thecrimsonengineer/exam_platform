name: Phase FC Flashcard Core Validation

on:
  push:
    branches:
      - phase-fc-flashcard-core
      - phase-fc2-provenance
      - phase-fc3-content-system
      - phase-fc4-collectibles
      - phase-fc5-memory
      - phase-fc6-learner-ui
      - phase-fc7-integration

permissions:
  contents: read

concurrency:
  group: phase-fc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: FC formatting gate
        run: |
          dart format \
            lib/features/flashcards \
            lib/features/learning_twin/integration/learning_twin_flashcard_guidance.dart \
            lib/screens/flashcards \
            lib/screens/admin/flashcards \
            lib/screens/admin/admin_home_screen.dart \
            lib/screens/courses/csp/domain_screen.dart \
            lib/screens/courses/csp/domain_screen_dark.dart \
            lib/screens/courses/csp/study_subtopic_screen.dart \
            lib/screens/courses/csp/study_subtopic_screen_dark.dart \
            lib/screens/courses/csp/quiz/quiz_screen.dart \
            lib/widgets/csp/study_content/study_content_renderer.dart \
            lib/widgets/csp/study_content/study_content_renderer_dark.dart \
            test/features/flashcards
          git diff --exit-code -- \
            lib/features/flashcards \
            lib/features/learning_twin/integration/learning_twin_flashcard_guidance.dart \
            lib/screens/flashcards \
            lib/screens/admin/flashcards \
            lib/screens/admin/admin_home_screen.dart \
            lib/screens/courses/csp/domain_screen.dart \
            lib/screens/courses/csp/domain_screen_dark.dart \
            lib/screens/courses/csp/study_subtopic_screen.dart \
            lib/screens/courses/csp/study_subtopic_screen_dark.dart \
            lib/screens/courses/csp/quiz/quiz_screen.dart \
            lib/widgets/csp/study_content/study_content_renderer.dart \
            lib/widgets/csp/study_content/study_content_renderer_dark.dart \
            test/features/flashcards
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: FC Run 1 identity and model tests
        run: |
          flutter test test/features/flashcards/registry/flashcard_ids_test.dart
          flutter test test/features/flashcards/models/flashcard_models_test.dart

      - name: FC Run 1 Concept Registry tests
        run: |
          flutter test test/features/flashcards/registry/flashcard_concept_catalog_test.dart
          flutter test test/features/flashcards/fixtures/flashcard_run1_fixture_test.dart

      - name: FC Run 1 architecture boundary
        run: flutter test test/features/flashcards/architecture/flashcard_run1_architecture_test.dart

      - name: FC Run 2 provenance tests
        run: |
          flutter test test/features/flashcards/provenance/flashcard_source_registry_test.dart
          flutter test test/features/flashcards/provenance/flashcard_provenance_validator_test.dart

      - name: FC Run 3 content-system tests
        run: |
          flutter test test/features/flashcards/fcq/fcq100_validator_test.dart
          flutter test test/features/flashcards/io/flashcard_package_json_codec_test.dart
          flutter test test/features/flashcards/repository/flashcard_package_repository_test.dart
          flutter test test/features/flashcards/studio/flashcard_studio_service_test.dart

      - name: FC Run 4 collectible-engine tests
        run: |
          flutter test test/features/flashcards/collection/flashcard_collection_repository_test.dart
          flutter test test/features/flashcards/collection/flashcard_unlock_service_test.dart
          flutter test test/features/flashcards/collection/daily_discovery_service_test.dart

      - name: FC Run 5 memory-engine tests
        run: |
          flutter test test/features/flashcards/memory/flashcard_interval_policy_test.dart
          flutter test test/features/flashcards/memory/flashcard_review_repository_test.dart
          flutter test test/features/flashcards/memory/flashcard_memory_service_test.dart
          flutter test test/features/flashcards/memory/flashcard_review_session_test.dart

      - name: FC Run 6 learner-experience tests
        run: |
          flutter test test/features/flashcards/learner/flashcard_learner_experience_controller_test.dart
          flutter test test/features/flashcards/ui/flashcard_collection_screen_test.dart
          flutter test test/features/flashcards/ui/flashcard_review_player_screen_test.dart
          flutter test test/features/flashcards/architecture/flashcard_run6_architecture_test.dart

      - name: FC Run 7 integration tests
        run: |
          flutter test test/features/flashcards/integration/flashcard_integration_service_test.dart
          flutter test test/features/flashcards/integration/flashcard_quiz_integration_test.dart
          flutter test test/features/flashcards/integration/flashcard_learning_twin_guidance_test.dart
          flutter test test/features/flashcards/integration/flashcard_admin_integration_test.dart
          flutter test test/features/flashcards/architecture/flashcard_run7_architecture_test.dart

      - name: Frozen MOT foundation regression
        run: |
          flutter test test/widgets/motion/csp11_flip_card_test.dart
          flutter test test/services/haptics/csp11_haptic_architecture_test.dart
