name: Readiness Entry Test Formatter

permissions:
  contents: write

on:
  push:
    branches:
      - phase-m7-exam-readiness

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'Format readiness entry test') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-m7-exam-readiness
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: dart format test/screens/practice/practice_hub_screen_test.dart
      - run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/screens/practice/practice_hub_screen_test.dart
          git commit -m "Format readiness entry test"
          git push origin HEAD:phase-m7-exam-readiness
