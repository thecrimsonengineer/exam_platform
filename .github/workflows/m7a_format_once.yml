name: M7A One-Shot Formatter

permissions:
  contents: write

on:
  push:
    branches:
      - phase-m7-exam-readiness

jobs:
  format-m7a:
    if: ${{ !startsWith(github.event.head_commit.message, 'Format M7A implementation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: phase-m7-exam-readiness

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Format M7A files
        run: |
          dart format \
            lib/features/exam_readiness/models/exam_study_plan.dart \
            lib/features/exam_readiness/models/study_schedule_exception.dart \
            lib/features/exam_readiness/models/study_capacity_snapshot.dart \
            lib/features/exam_readiness/repositories/exam_study_plan_repository.dart \
            lib/features/exam_readiness/services/exam_study_capacity_service.dart \
            lib/features/exam_readiness/screens/exam_plan_setup_screen.dart \
            lib/features/exam_readiness/screens/exam_readiness_plan_screen.dart \
            test/features/exam_readiness/m7a

      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo "M7A files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/exam_readiness/models/exam_study_plan.dart \
            lib/features/exam_readiness/models/study_schedule_exception.dart \
            lib/features/exam_readiness/models/study_capacity_snapshot.dart \
            lib/features/exam_readiness/repositories/exam_study_plan_repository.dart \
            lib/features/exam_readiness/services/exam_study_capacity_service.dart \
            lib/features/exam_readiness/screens/exam_plan_setup_screen.dart \
            lib/features/exam_readiness/screens/exam_readiness_plan_screen.dart \
            test/features/exam_readiness/m7a
          git commit -m "Format M7A implementation"
          git push origin HEAD:phase-m7-exam-readiness
