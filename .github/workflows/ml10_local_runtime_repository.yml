name: ML-10 Local Runtime Repository

on:
  push:
    branches:
      - phase-ml10-runtime-consumption-rotation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ml10-local-runtime
  cancel-in-progress: true

jobs:
  validate-ml10:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact ML-10 SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --check HEAD^

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze ML-10 tooling
        run: dart analyze tool/generate_ml10_runtime_bundle.dart lib/services/micro_learning/local_micro_fact_repository.dart test/micro_learning/local_micro_fact_repository_test.dart test/micro_learning/local_micro_fact_repository_asset_test.dart

      - name: Format ML-10 files
        run: dart format tool/generate_ml10_runtime_bundle.dart lib/services/micro_learning/local_micro_fact_repository.dart test/micro_learning/local_micro_fact_repository_test.dart test/micro_learning/local_micro_fact_repository_asset_test.dart

      - name: Generate local runtime bundle
        run: dart run tool/generate_ml10_runtime_bundle.dart

      - name: Verify bundle byte stability
        run: dart run tool/generate_ml10_runtime_bundle.dart --check

      - name: Test local repository
        run: |
          flutter test \\
            test/micro_learning/local_micro_fact_repository_test.dart \\
            test/micro_learning/local_micro_fact_repository_asset_test.dart

      - name: Revalidate startup independence
        run: |
          flutter test \
            test/startup/startup_screen_hardening_test.dart \
            test/startup/startup_release_render_smoke_test.dart

      - name: Commit generated runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- \
            content/micro_learning/ml10_runtime_bundle_v1.json \
            tool/generate_ml10_runtime_bundle.dart \
            lib/services/micro_learning/local_micro_fact_repository.dart \
            test/micro_learning/local_micro_fact_repository_test.dart \\
            test/micro_learning/local_micro_fact_repository_asset_test.dart; then
            echo "ML-10 generated bundle and Dart files are already byte-stable."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/micro_learning/ml10_runtime_bundle_v1.json
          git add tool/generate_ml10_runtime_bundle.dart
          git add lib/services/micro_learning/local_micro_fact_repository.dart
          git add test/micro_learning/local_micro_fact_repository_test.dart
          git add test/micro_learning/local_micro_fact_repository_asset_test.dart
          git commit -m "ML-10 freeze local runtime bundle"
          git push origin HEAD:phase-ml10-runtime-consumption-rotation
