name: Phase L3 One Shot Formatter

on:
  push:
    branches:
      - phase-l-lab-engine

permissions:
  contents: write

concurrency:
  group: phase-l3-format-once
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Canonically format L3 files
        run: |
          dart format             lib/features/lab/lab_learning_twin_bridge.dart             lib/features/lab/lab_debrief.dart             lib/features/lab/lab_learner_loader.dart             test/features/lab/lab_l3_test_fixtures.dart             test/features/lab/lab7_learning_twin_bridge_test.dart             test/features/lab/lab8_debrief_engine_test.dart             test/features/lab/lab9_reference_lab_e2e_test.dart

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "L3 files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/features/lab/lab_learning_twin_bridge.dart             lib/features/lab/lab_debrief.dart             lib/features/lab/lab_learner_loader.dart             test/features/lab/lab_l3_test_fixtures.dart             test/features/lab/lab7_learning_twin_bridge_test.dart             test/features/lab/lab8_debrief_engine_test.dart             test/features/lab/lab9_reference_lab_e2e_test.dart
          git commit -m "Format Phase L3 implementation"
          git push origin HEAD:phase-l-lab-engine
