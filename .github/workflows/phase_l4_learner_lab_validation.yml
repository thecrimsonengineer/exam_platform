name: Phase L4 Learner Decision LAB Validation

on:
  push:
    branches:
      - phase-l4-learner-decision-lab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-l4-learner-decision-lab
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Canonical Dart format
        run: |
          dart format \
            lib/screens/lab/lab_library_screen.dart \
            lib/screens/lab/lab_scenario_briefing_screen.dart \
            lib/screens/lab/lab_learner_debrief_screen.dart \
            lib/screens/lab/lab_scenario_catalog.dart \
            lib/screens/lab/lab_player_shell_screen.dart \
            lib/screens/lab/lab_reference_player_screen.dart \
            lib/screens/admin/lab/lab1000_studio_screen.dart \
            lib/features/lab/lab_dqg300.dart \
            lib/features/lab/lab_automated_publish_gate.dart \
            lib/features/lab/lab_automated_lifecycle.dart \
            lib/features/lab/lab_dqg300_certificate.dart \
            lib/features/lab/lab_dqg300_evidence_store.dart \
            lib/features/lab/lab_l4l_certificate.dart \
            lib/features/lab/lab_l4n_certificate.dart \
            lib/features/lab/lab_learning_twin_bridge.dart \
            lib/features/lab/lab_learning_twin_emitter.dart \
            lib/features/lab/lab_exhaustive_route_validator.dart \
            lib/features/lab/lab_reachable_route_explorer.dart \
            lib/features/lab/lab_publish_evidence_validator.dart \
            lib/features/lab/lab_snapshot_fingerprint.dart \
            lib/features/lab/lab_studio.dart \
            test/screens/lab \
            test/lab_quality \
            test/features/lab/lab1_shells_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Phase L4 learner experience regressions
        run: flutter test test/screens/lab

      - name: Phase L4K DQG300-LAB automated publish gate
        run: flutter test test/lab_quality

      - name: Phase L4L exhaustive route state and Story Gate tests
        run: flutter test test/lab_quality/l4l_exhaustive_route_validator_test.dart

      - name: Phase L4M reachable-route exploration
        run: flutter test test/lab_quality/l4m_reachable_route_explorer_test.dart

      - name: Phase L4N publish evidence validation
        run: flutter test test/lab_quality/l4n_publish_evidence_validator_test.dart

      - name: Phase L4O published immutability
        run: flutter test test/lab_quality/l4o_published_immutability_test.dart

      - name: Phase L4P Learning Twin evidence emission
        run: flutter test test/lab_quality/l4p_learning_twin_emission_test.dart

      - name: Preserve exact frozen Phase L engine suite
        run: flutter test test/features/lab

      - name: Full repository regression
        run: flutter test

      - name: Android debug build
        run: flutter build apk --debug

      - name: Production web build
        run: flutter build web --release

      - name: Diff hygiene
        run: git diff --check

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/screens/lab/lab_library_screen.dart \
            lib/screens/lab/lab_scenario_briefing_screen.dart \
            lib/screens/lab/lab_scenario_catalog.dart \
            lib/screens/lab/lab_player_shell_screen.dart \
            lib/screens/lab/lab_reference_player_screen.dart \
            lib/screens/admin/lab/lab1000_studio_screen.dart \
            lib/features/lab/lab_dqg300.dart \
            lib/features/lab/lab_automated_publish_gate.dart \
            lib/features/lab/lab_automated_lifecycle.dart \
            lib/features/lab/lab_dqg300_certificate.dart \
            lib/features/lab/lab_dqg300_evidence_store.dart \
            lib/features/lab/lab_l4l_certificate.dart \
            lib/features/lab/lab_l4n_certificate.dart \
            lib/features/lab/lab_learning_twin_bridge.dart \
            lib/features/lab/lab_learning_twin_emitter.dart \
            lib/features/lab/lab_exhaustive_route_validator.dart \
            lib/features/lab/lab_reachable_route_explorer.dart \
            lib/features/lab/lab_publish_evidence_validator.dart \
            lib/features/lab/lab_snapshot_fingerprint.dart \
            lib/features/lab/lab_studio.dart \
            test/screens/lab \
            test/lab_quality \
            test/features/lab/lab1_shells_test.dart
          git commit -m "Format Phase L4 learner and DQG300 LAB"
          git push origin HEAD:phase-l4-learner-decision-lab
