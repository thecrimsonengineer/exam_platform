name: M7C One-Shot Formatter

permissions:
  contents: write

on:
  push:
    branches:
      - phase-m7-exam-readiness

jobs:
  format-m7c:
    if: ${{ !startsWith(github.event.head_commit.message, 'Format M7C implementation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: phase-m7-exam-readiness

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format M7C files
        run: |
          dart format \
            lib/features/exam_readiness/models/competency_readiness_profile.dart \
            lib/features/exam_readiness/models/readiness_gap.dart \
            lib/features/exam_readiness/repositories/readiness_snapshot_repository.dart \
            lib/features/exam_readiness/services/readiness_gap_service.dart \
            lib/features/exam_readiness/services/readiness_profile_service.dart \
            lib/features/exam_readiness/screens/readiness_profile_screen.dart \
            lib/features/exam_readiness/screens/competency_readiness_screen.dart \
            lib/features/exam_readiness/screens/exam_readiness_profile_screen.dart \
            lib/features/exam_readiness/screens/exam_readiness_plan_screen.dart \
            test/features/exam_readiness/m7c

      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo "M7C files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/exam_readiness/models/competency_readiness_profile.dart \
            lib/features/exam_readiness/models/readiness_gap.dart \
            lib/features/exam_readiness/repositories/readiness_snapshot_repository.dart \
            lib/features/exam_readiness/services/readiness_gap_service.dart \
            lib/features/exam_readiness/services/readiness_profile_service.dart \
            lib/features/exam_readiness/screens/readiness_profile_screen.dart \
            lib/features/exam_readiness/screens/competency_readiness_screen.dart \
            lib/features/exam_readiness/screens/exam_readiness_profile_screen.dart \
            lib/features/exam_readiness/screens/exam_readiness_plan_screen.dart \
            test/features/exam_readiness/m7c
          git commit -m "Format M7C implementation"
          git push origin HEAD:phase-m7-exam-readiness
