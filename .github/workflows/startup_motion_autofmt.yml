name: Startup Motion Autoformat

on:
  push:
    branches:
      - phase-startup-motion
    paths:
      - 'lib/main.dart'
      - 'lib/screens/startup/**'
      - 'test/startup/**'
      - '.github/workflows/startup_motion_autofmt.yml'

permissions:
  contents: write

concurrency:
  group: startup-motion-autofmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-startup-motion

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Format startup files
        run: dart format lib/main.dart lib/screens/startup/csp11_startup_screen.dart lib/screens/startup/startup_timeline.dart lib/screens/startup/startup_personalization_service.dart test/startup/csp11_startup_asset_contract_test.dart test/startup/startup_timeline_test.dart test/startup/startup_personalization_service_test.dart

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Startup files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/screens/startup/csp11_startup_screen.dart lib/screens/startup/startup_timeline.dart lib/screens/startup/startup_personalization_service.dart test/startup/csp11_startup_asset_contract_test.dart test/startup/startup_timeline_test.dart test/startup/startup_personalization_service_test.dart
          git commit -m "SM-3 format startup personalization"
          git push origin HEAD:phase-startup-motion
