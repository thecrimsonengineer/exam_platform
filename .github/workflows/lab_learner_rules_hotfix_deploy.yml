name: LAB Learner Rules Hotfix Deploy

on:
  push:
    branches:
      - phase-lsp-batch2-direct-publication
    paths:
      - "firestore.rules"
      - ".github/workflows/lab_learner_rules_hotfix_deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FIREBASE_PROJECT_ID: csp11-exam-platform
  FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_FIRESTORE_READER_SERVICE_ACCOUNT: ${{ vars.GCP_FIRESTORE_READER_SERVICE_ACCOUNT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Compile Firestore rules
        run: |
          npx --yes firebase-tools@14.17.0 emulators:exec \
            --only firestore \
            --project csp11-exam-platform \
            "echo Firestore rules compiled"

      - id: auth_wif
        name: Authenticate with workload identity
        if: env.GCP_WIF_PROVIDER != '' && env.GCP_FIRESTORE_READER_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: csp11-exam-platform
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_FIRESTORE_READER_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true
          access_token_lifetime: 1800s

      - id: auth_json
        name: Authenticate with service account fallback
        if: env.GCP_WIF_PROVIDER == '' && env.FIREBASE_SERVICE_ACCOUNT_JSON != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: csp11-exam-platform
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          create_credentials_file: true
          access_token_lifetime: 1800s

      - name: Require deployment credential
        env:
          WIF_ACCESS_TOKEN: ${{ steps.auth_wif.outputs.access_token }}
          JSON_ACCESS_TOKEN: ${{ steps.auth_json.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$WIF_ACCESS_TOKEN$JSON_ACCESS_TOKEN"

      - name: Deploy learner LAB Firestore rules
        run: |
          npx --yes firebase-tools@14.17.0 deploy \
            --only firestore:rules \
            --project csp11-exam-platform \
            --non-interactive

      - name: Confirm deployment
        run: echo "LAB_LEARNER_RULES_HOTFIX=DEPLOYED"
