name: ERDP-7 Build Readiness Action Integration

on:
  push:
    branches:
      - phase-erdp7-readiness-action-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Apply ERDP-7 wiring
        run: |
          python3 tool/erdp7_wire.py

      - name: Harden ERDP-7 generated contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              source = p.read_text()
              if old not in source:
                  raise SystemExit(f'ERDP-7 hardening anchor missing in {path}: {old[:100]!r}')
              p.write_text(source.replace(old, new, count))

          path = 'lib/features/exam_readiness/services/daily_study_plan_service.dart'
          replace(
              path,
              "      case StudyPlanBlockType.spacedReview:\n      case StudyPlanBlockType.recovery:\n        return TodayPlanTaskCategory.remember;\n      case StudyPlanBlockType.repair:\n      case StudyPlanBlockType.diagnostic:\n",
              "      case StudyPlanBlockType.spacedReview:\n      case StudyPlanBlockType.recovery:\n        return TodayPlanTaskCategory.remember;\n      case StudyPlanBlockType.diagnostic:\n",
          )
          replace(
              path,
              "  int _questionCount(StudyPlanBlockType type, int minutes) {\n    switch (type) {\n      case StudyPlanBlockType.diagnostic:\n",
              "  int _questionCount(StudyPlanBlockType type, int minutes) {\n    switch (type) {\n      case StudyPlanBlockType.repair:\n      case StudyPlanBlockType.diagnostic:\n",
          )

          path = 'lib/screens/lab/lab_reference_player_screen.dart'
          replace(
              path,
              "    return samples == 0 ? 0 : (total / samples).clamp(0.0, 1.0);\n",
              "    return samples == 0\n        ? 0.0\n        : (total / samples).clamp(0.0, 1.0).toDouble();\n",
          )

          path = 'lib/features/exam_readiness/services/study_plan_completion_evidence_service.dart'
          replace(
              path,
              "      case TodayPlanTaskCategory.practice:\n        return 'Completes automatically when the planned quiz finishes.';\n",
              "      case TodayPlanTaskCategory.practice:\n        final applicationLab =\n            block.type == StudyPlanBlockType.repair &&\n            block.reasonCodes.any(\n              (reason) => reason.trim().toUpperCase() == 'APPLICATION_GAP',\n            );\n        return applicationLab\n            ? 'Completes automatically when the planned LAB scenario finishes.'\n            : 'Completes automatically when the planned quiz finishes.';\n",
          )

          path = 'lib/features/exam_readiness/services/readiness_intelligence_service.dart'
          replace(
              path,
              "    final coverageGap = _firstWithGap(\n      profiles,\n      ReadinessGapType.coverageGap,\n    );\n",
              "    final coverageGap = _firstWithGap(\n      profiles,\n      ReadinessGapType.coverageGap,\n      includeEvidenceLimited: true,\n    );\n",
          )
          replace(
              path,
              "  CompetencyReadinessProfile? _firstWithGap(\n    Iterable<CompetencyReadinessProfile> profiles,\n    ReadinessGapType type,\n  ) {\n    for (final profile in profiles) {\n      if (profile.gaps.any(\n        (gap) => !gap.evidenceLimited && gap.type == type,\n      )) {\n        return profile;\n      }\n    }\n    return null;\n  }\n",
              "  CompetencyReadinessProfile? _firstWithGap(\n    Iterable<CompetencyReadinessProfile> profiles,\n    ReadinessGapType type, {\n    bool includeEvidenceLimited = false,\n  }) {\n    for (final profile in profiles) {\n      if (profile.gaps.any(\n        (gap) =>\n            gap.type == type &&\n            (includeEvidenceLimited || !gap.evidenceLimited),\n      )) {\n        return profile;\n      }\n    }\n    return null;\n  }\n",
          )

          path = 'lib/features/exam_readiness/services/readiness_action_integration_service.dart'
          replace(
              path,
              "    final applicationRepair =\n        block.type == StudyPlanBlockType.repair &&\n        reasons.contains('APPLICATION_GAP');\n\n    return switch (kind) {\n",
              "    final applicationRepair =\n        block.type == StudyPlanBlockType.repair &&\n        reasons.contains('APPLICATION_GAP');\n    final practiceRepair =\n        block.type == StudyPlanBlockType.repair &&\n        (reasons.contains('KNOWLEDGE_MASTERY_GAP') ||\n            reasons.contains('DIFFICULTY_PERFORMANCE_GAP'));\n\n    return switch (kind) {\n",
          )
          replace(
              path,
              "            block.type == StudyPlanBlockType.competencyRecheck ||\n            (block.type == StudyPlanBlockType.repair && !applicationRepair),\n",
              "            block.type == StudyPlanBlockType.competencyRecheck ||\n            practiceRepair,\n",
          )

          path = 'test/features/exam_readiness/erdp/erdp7_readiness_action_integration_test.dart'
          p = Path(path)
          source = p.read_text()
          for line in [
              "import 'package:exam_platform/features/exam_readiness/models/advanced_readiness_snapshot.dart';\n",
              "import 'package:exam_platform/features/exam_readiness/models/capacity_pressure_snapshot.dart';\n",
              "import 'package:exam_platform/features/exam_readiness/models/coverage_projection.dart';\n",
              "import 'package:exam_platform/features/exam_readiness/models/exam_preparation_phase.dart';\n",
              "import 'package:exam_platform/features/exam_readiness/models/readiness_index_snapshot.dart';\n",
              "import 'package:exam_platform/features/exam_readiness/models/readiness_trajectory_point.dart';\n",
              "import 'package:exam_platform/features/exam_readiness/models/recovery_protection_snapshot.dart';\n",
          ]:
              source = source.replace(line, '')
          p.write_text(source)
          PY

      - name: Resolve packages
        run: flutter pub get

      - name: Format ERDP-7 surface
        run: |
          dart format \
            lib/features/exam_readiness/models/study_plan_execution_target.dart \
            lib/features/exam_readiness/navigation/flutter_study_plan_execution_navigator.dart \
            lib/features/exam_readiness/navigation/study_plan_block_launcher.dart \
            lib/features/exam_readiness/screens/todays_plan_screen.dart \
            lib/features/exam_readiness/services/daily_study_plan_service.dart \
            lib/features/exam_readiness/services/learning_evidence_normalizer.dart \
            lib/features/exam_readiness/services/phase_aware_daily_plan_service.dart \
            lib/features/exam_readiness/services/readiness_action_integration_service.dart \
            lib/features/exam_readiness/services/readiness_intelligence_service.dart \
            lib/features/exam_readiness/services/study_plan_completion_evidence_service.dart \
            lib/features/exam_readiness/services/study_plan_outcome_service.dart \
            lib/features/exam_readiness/services/today_plan_task_category_policy.dart \
            lib/screens/lab/lab_library_screen.dart \
            lib/screens/lab/lab_scenario_briefing_screen.dart \
            lib/screens/lab/lab_player_shell_screen.dart \
            lib/screens/lab/lab_reference_player_screen.dart \
            test/features/exam_readiness/erdp/erdp7_readiness_action_integration_test.dart

      - name: Analyze ERDP-7 integrated surface
        run: |
          dart analyze \
            lib/features/exam_readiness/models/study_plan_execution_target.dart \
            lib/features/exam_readiness/navigation/flutter_study_plan_execution_navigator.dart \
            lib/features/exam_readiness/navigation/study_plan_block_launcher.dart \
            lib/features/exam_readiness/screens/todays_plan_screen.dart \
            lib/features/exam_readiness/services/daily_study_plan_service.dart \
            lib/features/exam_readiness/services/learning_evidence_normalizer.dart \
            lib/features/exam_readiness/services/phase_aware_daily_plan_service.dart \
            lib/features/exam_readiness/services/readiness_action_integration_service.dart \
            lib/features/exam_readiness/services/readiness_intelligence_service.dart \
            lib/features/exam_readiness/services/study_plan_completion_evidence_service.dart \
            lib/features/exam_readiness/services/study_plan_outcome_service.dart \
            lib/features/exam_readiness/services/today_plan_task_category_policy.dart \
            lib/screens/lab/lab_library_screen.dart \
            lib/screens/lab/lab_scenario_briefing_screen.dart \
            lib/screens/lab/lab_player_shell_screen.dart \
            lib/screens/lab/lab_reference_player_screen.dart \
            test/features/exam_readiness/erdp/erdp7_readiness_action_integration_test.dart

      - name: Run ERDP-7 integration tests
        run: flutter test test/features/exam_readiness/erdp/erdp7_readiness_action_integration_test.dart

      - name: Run ERDP-6 evidence regression
        run: flutter test test/features/exam_readiness/erdp/erdp6_closed_evidence_loop_test.dart

      - name: Run ERDP-5 executable-control regression
        run: flutter test test/features/exam_readiness/erdp/erdp5_executable_daily_plan_test.dart

      - name: Run ERDP-4 execution regressions
        run: |
          flutter test test/features/exam_readiness/erdp/erdp4_execution_router_test.dart
          flutter test test/features/exam_readiness/erdp/erdp4_execution_store_test.dart

      - name: Run ERDP-3 planner regressions
        run: |
          flutter test test/features/exam_readiness/erdp/erdp3_balanced_portfolio_policy_test.dart
          flutter test test/features/exam_readiness/erdp/erdp3_balanced_planner_integration_test.dart
          flutter test test/features/exam_readiness/erdp/erdp3_daily_constraints_test.dart

      - name: Run ERDP-2 Flashcard regression
        run: flutter test test/features/exam_readiness/erdp/erdp2_flashcard_execution_test.dart

      - name: Run M7D Daily Plan regression
        run: flutter test test/features/exam_readiness/m7d

      - name: Run LAB runtime regressions
        run: |
          flutter test test/features/lab/lab4_session_engine_test.dart
          flutter test test/features/lab/lab7_learning_twin_bridge_test.dart
          flutter test test/features/lab/lab9_reference_lab_e2e_test.dart

      - name: Diff hygiene
        run: git diff --check

      - name: Commit ERDP-7 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "ERDP-7 integrate readiness actions with Daily Plan"
          git push origin HEAD:phase-erdp7-readiness-action-integration
