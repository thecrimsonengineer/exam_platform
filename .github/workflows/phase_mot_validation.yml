name: Phase MOT Motion Validation

on:
  push:
    branches:
      - phase-mot-motion-system

permissions:
  contents: read

concurrency:
  group: phase-mot-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Formatting gate
        run: >
          dart format --output=none --set-exit-if-changed
          lib/theme/motion
          lib/widgets/motion
          lib/navigation/csp11_route.dart
          lib/screens/navigation/bottom_navigation.dart
          lib/screens/settings/settings_route.dart
          lib/screens/home/home_screen.dart
          lib/screens/home/home_screen_dark.dart
          lib/screens/courses/csp/csp_study_hub_screen.dart
          lib/screens/courses/csp/csp_study_hub_screen_dark.dart
          lib/screens/courses/csp/domain_screen.dart
          lib/screens/courses/csp/domain_screen_dark.dart
          lib/screens/courses/csp/competency_screen.dart
          lib/screens/courses/csp/study_subtopic_screen.dart
          lib/screens/courses/csp/study_subtopic_screen_dark.dart
          lib/screens/courses/csp/quiz/quiz_screen.dart
          lib/screens/courses/csp/quiz/result/result_screen.dart
          lib/screens/courses/csp/quiz/widgets/answers/answer_option_card.dart
          lib/screens/lab/lab_reference_player_screen.dart
          lib/screens/lab/lab_player_shell_screen.dart
          lib/features/learning_twin/ui/learning_twin_motion_reveal.dart
          lib/features/learning_twin/ui/learning_twin_celebration.dart
          lib/features/learning_twin/ui/learning_twin_ui.dart
          lib/features/learning_twin/integration/learning_twin_progress_guidance.dart
          lib/features/learning_twin/integration/learning_twin_post_practice_guidance.dart
          lib/features/learning_twin/integration/learning_twin_pre_practice_guidance.dart
          lib/features/learning_twin/integration/learning_twin_study_hub_guidance.dart
          test/theme/motion
          test/widgets/motion
          test/navigation/csp11_motion_run1_contract_test.dart
          test/navigation/csp11_motion_run2_contract_test.dart
          test/navigation/csp11_motion_run3_contract_test.dart
          test/screens/courses/csp/domain_screen_direct_study_navigation_test.dart
          test/screens/courses/csp/quiz_tag_dark_mode_navigation_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: MOT Run 1 through Run 3 tests
        run: |
          flutter test test/theme/motion/csp11_motion_tokens_test.dart
          flutter test test/widgets/motion/csp11_motion_primitives_test.dart
          flutter test test/widgets/motion/csp11_staggered_reveal_test.dart
          flutter test test/widgets/motion/csp11_completion_reveal_test.dart
          flutter test test/widgets/motion/csp11_flip_card_test.dart
          flutter test test/navigation/csp11_motion_run1_contract_test.dart
          flutter test test/navigation/csp11_motion_run2_contract_test.dart
          flutter test test/navigation/csp11_motion_run3_contract_test.dart

      - name: LAB Run 3 regression tests
        run: |
          flutter test test/screens/lab/lab_player_mode_navigation_test.dart
          flutter test test/screens/lab/lab_player_story_gate_test.dart
          flutter test test/screens/lab/lab_l4_ending_debrief_test.dart

      - name: Learning Twin Run 3 regression tests
        run: |
          flutter test test/features/learning_twin/ui/learning_twin_ui_test.dart
          flutter test test/features/learning_twin/ui/learning_twin_m2_completion_test.dart
          flutter test test/features/learning_twin/integration/learning_twin_progress_guidance_test.dart
          flutter test test/features/learning_twin/integration/learning_twin_post_practice_guidance_test.dart
          flutter test test/features/learning_twin/integration/learning_twin_pre_practice_guidance_test.dart
          flutter test test/features/learning_twin/integration/learning_twin_study_hub_guidance_test.dart

      - name: Learn navigation regression tests
        run: |
          flutter test test/screens/courses/csp/domain_screen_direct_study_navigation_test.dart
          flutter test test/screens/courses/csp/quiz_tag_dark_mode_navigation_test.dart

      - name: Quiz UI regression tests
        run: |
          flutter test test/screens/courses/csp/csp11_p6_3_1_quiz_question_contrast_contract_test.dart
          flutter test test/screens/courses/csp/quiz_domain_label_test.dart

      - name: Settings regression tests
        run: |
          flutter test test/screens/settings/csp11_settings_p5_contract_test.dart
          flutter test test/screens/settings/csp11_settings_p6_dark_mode_contract_test.dart
          flutter test test/screens/settings/csp11_settings_interaction_test.dart

      - name: Frozen HAP regression tests
        run: |
          flutter test test/services/haptics/csp11_haptic_service_test.dart
          flutter test test/services/haptics/csp11_haptic_architecture_test.dart
