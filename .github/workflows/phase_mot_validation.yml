name: Phase MOT Motion Validation

on:
  push:
    branches:
      - phase-mot-motion-system

permissions:
  contents: write

concurrency:
  group: phase-mot-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Apply canonical formatting
        run: |
          dart format lib/theme/motion lib/widgets/motion lib/navigation/csp11_route.dart lib/screens/navigation/bottom_navigation.dart lib/screens/settings/settings_route.dart test/theme/motion test/widgets/motion test/navigation/csp11_motion_run1_contract_test.dart
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/theme/motion lib/widgets/motion lib/navigation/csp11_route.dart lib/screens/navigation/bottom_navigation.dart lib/screens/settings/settings_route.dart test/theme/motion test/widgets/motion test/navigation/csp11_motion_run1_contract_test.dart
            git commit -m "MOT: apply Run 1 canonical formatter output"
            git push
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: MOT Run 1 tests
        run: |
          flutter test test/theme/motion/csp11_motion_tokens_test.dart
          flutter test test/widgets/motion/csp11_motion_primitives_test.dart
          flutter test test/navigation/csp11_motion_run1_contract_test.dart

      - name: Settings regression tests
        run: |
          flutter test test/screens/settings/csp11_settings_p5_contract_test.dart
          flutter test test/screens/settings/csp11_settings_p6_dark_mode_contract_test.dart
          flutter test test/screens/settings/csp11_settings_interaction_test.dart

      - name: Frozen HAP regression tests
        run: |
          flutter test test/services/haptics/csp11_haptic_service_test.dart
          flutter test test/services/haptics/csp11_haptic_architecture_test.dart
