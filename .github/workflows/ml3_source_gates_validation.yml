name: ML-3 Source Gates Validation

on:
  push:
    branches:
      - phase-ml3-source-gates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml3-source-gates-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate-ml3:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact ML-3 SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact SHA and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          echo "ML-3 exact SHA: ${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --check HEAD^

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Verify ML-3 formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/services/micro_learning/micro_fact_source_gate_validator.dart \
            tool/validate_micro_learning_source_gates.dart \
            test/micro_learning/micro_fact_source_gate_validator_test.dart
          git diff --check
          git diff -- \
            lib/services/micro_learning/micro_fact_source_gate_validator.dart \
            tool/validate_micro_learning_source_gates.dart \
            test/micro_learning/micro_fact_source_gate_validator_test.dart
          git diff --exit-code -- \
            lib/services/micro_learning/micro_fact_source_gate_validator.dart \
            tool/validate_micro_learning_source_gates.dart \
            test/micro_learning/micro_fact_source_gate_validator_test.dart

      - name: Analyze ML-3 implementation
        shell: bash
        run: |
          set -euo pipefail
          dart analyze \
            lib/services/micro_learning/micro_fact_source_gate_validator.dart \
            tool/validate_micro_learning_source_gates.dart \
            test/micro_learning/micro_fact_source_gate_validator_test.dart

      - name: Validate ML-3 source gates
        run: dart run tool/validate_micro_learning_source_gates.dart

      - name: Run ML-1 through ML-3 focused regression
        shell: bash
        run: |
          set -euo pipefail
          flutter test \
            test/micro_learning/authority_registry_validator_test.dart \
            test/micro_learning/micro_fact_schema_validator_test.dart \
            test/micro_learning/micro_fact_source_gate_validator_test.dart
