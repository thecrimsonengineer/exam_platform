name: M7 Pre-Implementation Contract

on:
  push:
    branches:
      - phase-m7-exam-readiness
  workflow_dispatch:

jobs:
  verify-pre-m7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen M7 contract
        run: python3 tools/verify_m7_contract.py --phase pre

      - name: Git whitespace audit
        run: git diff --check HEAD^

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Full Flutter regression
        run: flutter test
