name: Phase L3 Final Closure Gate

on:
  push:
    branches:
      - phase-l-lab-engine
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-l3-closure
  cancel-in-progress: true

jobs:
  validate-l3:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Verify L3 ancestry and branch boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin phase-l2-closed
          git merge-base --is-ancestor origin/phase-l2-closed HEAD
          test "$GITHUB_REF_NAME" = "phase-l-lab-engine"

      - name: Strict Phase L formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/lab \
            lib/screens/lab \
            lib/screens/admin/lab \
            test/features/lab

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run exact 1,000 Phase L tests
        shell: bash
        run: |
          set -euo pipefail
          set +e
          flutter test test/features/lab --reporter json > /tmp/phase_l_tests.jsonl
          test_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            echo "Phase L tests failed. Re-running with expanded output."
            flutter test test/features/lab --reporter expanded
            exit "$test_status"
          fi
          python3 - <<'PY'
          import json
          from collections import Counter

          counts = Counter()
          for line in open('/tmp/phase_l_tests.jsonl', encoding='utf-8'):
              line = line.strip()
              if not line or not line.startswith('{'):
                  continue
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get('type') != 'testStart':
                  continue
              name = event.get('test', {}).get('name', '')
              for prefix in tuple(f'LAB-{i}' for i in range(10)):
                  if name.startswith(prefix):
                      counts[prefix] += 1
                      break

          expected = {
              'LAB-0': 50,
              'LAB-1': 50,
              'LAB-2': 150,
              'LAB-3': 170,
              'LAB-4': 110,
              'LAB-5': 170,
              'LAB-6': 110,
              'LAB-7': 60,
              'LAB-8': 50,
              'LAB-9': 80,
          }
          print('Executed Phase L tests:', dict(counts))
          if dict(counts) != expected:
              raise SystemExit(f'Expected {expected}, got {dict(counts)}')
          if sum(counts[p] for p in ('LAB-7', 'LAB-8', 'LAB-9')) != 190:
              raise SystemExit('STEP L3 must contain exactly 190 tests.')
          if sum(counts.values()) != 1000:
              raise SystemExit('Final Phase L closure must contain exactly 1,000 tests.')
          PY

      - name: Reference LAB golden pipeline
        run: |
          flutter test test/features/lab/lab9_reference_lab_e2e_test.dart \
            --plain-name "LAB-9 JSON Studio publish learner load 1"

      - name: Deterministic replay and intelligence bridge
        run: |
          flutter test test/features/lab/lab7_learning_twin_bridge_test.dart
          flutter test test/features/lab/lab8_debrief_reconstruction_test.dart
          flutter test test/features/lab/lab9_reference_lab_e2e_test.dart

      - name: Admin and learner permission regressions
        run: |
          flutter test test/screens/auth/admin_gate_test.dart
          flutter test test/screens/navigation
          flutter test test/screens/settings
          flutter test test/features/learning_twin

      - name: Frozen safety contracts
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'OpenAI|runtime[[:space:]]+LLM|generate.*branch' lib/features/lab/lab_runtime.dart
          ! grep -RniE 'javascript|dartcode|shell|remotecode' test/fixtures/lab/l3_reference_confined_space_h2s.json

      - name: Full repository regression
        run: flutter test

      - name: Android debug build
        run: flutter build apk --debug

      - name: Production web build
        run: flutter build web --release

      - name: Diff hygiene
        run: |
          git diff --check
          git status --short
