name: Phase L3 Final Closure Gate

on:
  push:
    branches:
      - phase-l-lab-engine
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-l3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-l3:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Verify L3 ancestry and branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin phase-l2-closed
          git merge-base --is-ancestor origin/phase-l2-closed HEAD
          test "$GITHUB_REF_NAME" = "phase-l-lab-engine"

      - name: Frozen architecture checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "A LAB is a deterministic, JSON-authored, four-option safety decision simulation" docs/lab/PHASE_L_LAB_ENGINE_FREEZE.md
          grep -q "Learning Twin integration must not be allowed to modify authored story truth or gate selection." docs/lab/PHASE_L_LAB_ENGINE_FREEZE.md
          grep -q "Alternate timelines must be derived from authored graph logic" docs/lab/PHASE_L_LAB_ENGINE_FREEZE.md
          test -f test/fixtures/lab/l3_reference_confined_space_h2s.json
          if grep -R -n -E "OpenAI|Gemini|Anthropic|ChatGPT|runtime LLM|generateStory|generateBranch" lib/features/lab --include='*.dart'; then
            echo "Runtime LLM dependency or story generation marker found in LAB engine."
            exit 1
          fi

      - name: Strict Phase L formatting
        run: |
          dart format --output=none --set-exit-if-changed             lib/features/lab             lib/screens/lab             lib/screens/admin/lab             test/features/lab

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run exact 1000-test Phase L budget
        shell: bash
        run: |
          set -euo pipefail
          set +e
          flutter test test/features/lab --reporter json > /tmp/phase_l_tests.jsonl
          test_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            echo "Phase L tests failed. Re-running with expanded output."
            flutter test test/features/lab --reporter expanded
            exit "$test_status"
          fi
          python3 - <<'PY'
          import json
          from collections import Counter

          counts = Counter()
          for line in open('/tmp/phase_l_tests.jsonl', encoding='utf-8'):
              line = line.strip()
              if not line or not line.startswith('{'):
                  continue
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if event.get('type') != 'testStart':
                  continue
              name = event.get('test', {}).get('name', '')
              for prefix in tuple(f'LAB-{i}' for i in range(10)):
                  if name.startswith(prefix):
                      counts[prefix] += 1
                      break

          expected = {
              'LAB-0': 50,
              'LAB-1': 50,
              'LAB-2': 150,
              'LAB-3': 170,
              'LAB-4': 110,
              'LAB-5': 170,
              'LAB-6': 110,
              'LAB-7': 60,
              'LAB-8': 50,
              'LAB-9': 80,
          }
          print('Executed Phase L tests:', dict(counts))
          if dict(counts) != expected:
              raise SystemExit(f'Expected {expected}, got {dict(counts)}')
          if sum(counts[p] for p in ('LAB-7', 'LAB-8', 'LAB-9')) != 190:
              raise SystemExit('STEP L3 must contain exactly 190 tests.')
          if sum(counts.values()) != 1000:
              raise SystemExit('Final Phase L closure must contain exactly 1,000 tests.')
          PY

      - name: Reference LAB golden publish and learner flow
        run: |
          flutter test test/features/lab/lab9_reference_lab_e2e_test.dart             --plain-name "LAB-9 JSON Studio publish learner load 1"
          flutter test test/features/lab/lab9_reference_lab_e2e_test.dart             --plain-name "LAB-9 safe route 1"
          flutter test test/features/lab/lab9_reference_lab_e2e_test.dart             --plain-name "LAB-9 resume debrief Learning Twin evidence 1"

      - name: Published immutability and deterministic replay
        run: |
          flutter test test/features/lab/lab6_studio_pipeline_test.dart             --plain-name "LAB-6 immutable publish 1"
          flutter test test/features/lab/lab9_reference_lab_e2e_test.dart             --plain-name "LAB-9 deterministic golden replay and UI boundary 1"

      - name: Admin learner and settings regressions
        run: |
          flutter test test/screens/auth/admin_gate_test.dart
          flutter test test/screens/navigation
          flutter test test/screens/settings

      - name: Full repository regression
        run: flutter test

      - name: Android debug build
        run: flutter build apk --debug

      - name: Production web build
        run: flutter build web --release

      - name: Diff hygiene
        run: |
          git diff --check
          git status --short
