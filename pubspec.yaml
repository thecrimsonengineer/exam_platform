name: exam_platform
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  archive: 4.0.9
  google_fonts: ^8.2.1
  flutter_svg: ^2.2.0
  avatar_maker: 1.8.0
  file_selector: ^1.1.0
  shared_preferences: ^2.5.5
  cloud_firestore: ^6.8.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  equatable: ^2.0.7
  url_launcher: ^6.3.2
  supabase_flutter: 2.17.2
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  lottie: ^3.6.1
  flutter_animate: ^4.5.2

dev_dependencies:
  fake_cloud_firestore: 4.2.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - content/
    - content/domain_07/competencies/
    - assets/learning_twin/
    - assets/learning_twin/candidates/
    - assets/startup/

flutter_launcher_icons:
  android: true
  image_path: assets/icon/csp11_logo.png
  adaptive_icon_background: "#080B10"
  adaptive_icon_foreground: assets/icon/csp11_logo_foreground.png
  min_sdk_android: 21

  web:
    generate: true
    image_path: assets/icon/csp11_logo.png
    background_color: "#080B10"
    theme_color: "#080B10"
